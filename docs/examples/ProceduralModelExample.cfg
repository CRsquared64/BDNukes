// Example part using every BDNukes 1.1 part-framework feature. This file is NOT loaded by KSP (it lives
// outside GameData); copy it into GameData to try it. A Fat Man-style bomb: egg-shaped body, a box tail
// shroud joining four fins, a second small fin set, painted bands, a dial-a-yield warhead, a laydown fuze
// and BDArmory transforms.
PART:NEEDS[BDArmory]
{
	name = bdnukesProceduralExample
	module = Part
	author = BDNukes

	// Placeholder only: ModuleProceduralModel strips its renderers and colliders at load.
	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (radius 0.76 m)
	node_attach = 0, 0.76, 0, 0, 1, 0, 1
	attachRules = 0,1,0,0,1

	TechRequired = experimentalScience
	entryCost = 10000
	cost = 20000
	category = none
	bdacategory = Bombs
	subcategory = 0
	bulkheadProfiles = srf
	title = Procedural Model Example
	manufacturer = BDNukes
	description = Demonstrates ModuleProceduralModel, ModuleNukeYieldSelector, the laydown fuze and ModuleReentryVehicle.
	mass = 4.6
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 10
	breakingForce = 500
	breakingTorque = 500
	maxTemp = 2000

	// List ModuleProceduralModel first so the named transforms exist before other modules' OnLoad looks for them.
	MODULE
	{
		name = ModuleProceduralModel
		axis = Z                    // Z: nose +Z (missiles/bombs). Y: nose +Y (vertical/stack parts)
		length = 3.25               // m; centred: nose at +1.625, tail at -1.625
		segments = 48               // optional (8-128, default 48): facets around the body
		bodyColor = 0.80, 0.72, 0.20
		shininess = 0.3
		panelLines = true           // longitudinal panel lines and rivet rows
		seamSpacing = 0.8           // circumferential seams every 0.8 m from the nose (0 = none)
		collider = capsule          // capsule (max radius, along the axis) | box (whole model incl. fins) | none
		PROFILE
		{
			// distance from nose (m), radius (m); nose to tail. A profile that ends at a non-zero radius gets a flat cap.
			point = 0.00, 0.00
			point = 0.05, 0.30
			point = 0.20, 0.55
			point = 0.45, 0.70
			point = 0.80, 0.76
			point = 1.40, 0.76
			point = 1.90, 0.66
			point = 2.40, 0.40
			point = 2.60, 0.30
			point = 3.20, 0.28
			point = 3.25, 0.00
		}
		BAND                        // painted stripes; any number, later ones paint over earlier ones
		{
			from = 0.4
			to = 0.5
			color = 1, 0.85, 0.1
		}
		BAND
		{
			from = 1.0
			to = 1.08
			color = 0.15, 0.15, 0.15
		}
		FINS                        // main tail fins with a Fat Man-style box shroud joining the tips
		{
			count = 4
			roll = 45               // first fin angle: 0 = part +X, increasing toward +Y
			rootFront = 2.5
			rootBack = 3.2
			tipFront = 2.8
			tipBack = 3.25
			span = 0.8              // tip distance from the axis
			thickness = 0.03
			color = 0.3, 0.3, 0.3   // optional; default bodyColor * 0.8
			shroud = box            // none | box (flat plates between tips) | ring (cylinder through tips)
			shroudChord = 0.35      // along the axis, ending at tipBack (default tipBack - tipFront)
		}
		FINS                        // small canards with a ring shroud and the default colour
		{
			count = 3
			roll = 0
			rootFront = 0.9
			rootBack = 1.2
			tipFront = 1.0
			tipBack = 1.2
			span = 0.95
			thickness = 0.02
			shroud = ring
			shroudChord = 0.1
		}
		TRANSFORM                   // empty transforms that BDArmory modules look up by name
		{
			name = exhaustTransform
			position = 0, 0, -1.65  // part-local metres
			forward = 0, 0, -1      // direction the transform's +Z faces (default: the nose direction)
		}
		TRANSFORM
		{
			name = fireTransform
			position = 0, 0, 1.65
			forward = 0, 0, 1
			up = 0, 1, 0            // optional: direction for the transform's +Y (default world-style up)
		}
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 21
		thermalRadius = 1800
		fluence = 21
		isEMP = true
		reportingName = Procedural Example
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeYieldSelector
		yields = 0.3, 1.5, 10, 50   // kt; PAW shows "0.3 kt / 1.5 kt / 10 kt / 50 kt" (>= 1000 kt shown in Mt)
		defaultIndex = 3
		thermalRadiusAtMax = 2400   // scaled by (y/ymax)^(1/3); fluence = y
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 12
		detonateOnDestroyed = true
		airburstAltitude = 0
		maxProximityRange = 3000
		armingDelay = 3
		laydownDelay = 30           // s after touchdown (PAW slider 0-120, 0 = off)
		laydownMaxSpeed = 60        // contacts slower than this start the laydown countdown
	}

	MODULE
	{
		name = ModuleReentryVehicle
		plasmaMinSpeed = 1500
		plasmaScale = 1
		spinRate = 0                // deg/s around the nose axis after release
	}
}
