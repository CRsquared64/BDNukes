// BDNukes projectile definitions. BDArmory reads BULLET nodes from any GameData folder
// (GameDatabase.GetConfigs("BULLET")). nuclear = True makes BDArmory call NukeFX.CreateExplosion with
// tntMass as the yield in kilotons, and BDNukes renders the cinematic explosion.
// Fields follow BDArmory's WMDBullet (BDArmory/BulletDefs/BD_Bullets.cfg).

// M388 Davy Crockett: the W54 warhead (10-20 t; 20 t used) in an over-calibre 279 mm (11 in), 34.5 kg
// teardrop round with tail fins, fitted on a spigot over the muzzle of the M29 155 mm recoilless rifle.
// Low velocity (~180 m/s here) and a steep arc: ~2-4 km range. Fired by bdnukesM29DavyCrockett.
BULLET:NEEDS[BDArmory]
{
	name = BDNukes_M388
	DisplayName = M388 Davy Crockett (W54)
	caliber = 279                   // mm, warhead body diameter (the spigot sits over the 155 mm barrel)
	bulletVelocity = 180            // m/s
	bulletMass = 34.5               // kg
	//HE Bullet Values
	explosive = None
	incendiary = False
	nuclear = True
	EMP = True
	tntMass = 0.02                  // kilotons for nuclear shells: 20 tons TNT
	fuzeType = Impact
	projectileColor = 255, 242, 0, 128
	fadeColor = False
	startColor = 128, 128, 128, 0
	projectileCount = 1
	apBulletMod = 1                 // N/A
	bulletDragTypeName = AnalyticEstimate
}
