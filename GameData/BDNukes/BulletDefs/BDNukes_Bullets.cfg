// BDNukes projectile definitions. BDArmory reads BULLET nodes from any GameData folder
// (GameDatabase.GetConfigs("BULLET")). nuclear = True makes BDArmory call NukeFX.CreateExplosion with
// tntMass as the yield in kilotons, and BDNukes renders the cinematic explosion.
// Fields follow BDArmory's WMDBullet (BDArmory/BulletDefs/BD_Bullets.cfg).

// M388 Davy Crockett: the W54 warhead (10-20 t; 20 t used) in an over-calibre 279 mm (11 in), 34.5 kg
// teardrop round with tail fins, fitted on a spigot over the muzzle of the M29 155 mm recoilless rifle.
// The M29 reached ~4 km (the light M28 ~2 km). With BDArmory's drag (Cd 0.295 on the 279 mm body: ballistic
// coefficient 1,914 kg/m^2), 180 m/s only reaches ~2.0 km at best elevation; 300 m/s reaches ~3.5 km in 29 s.
// The real muzzle velocity is not well documented, so it is set from the range. Fired by bdnukesM29DavyCrockett.
// BDArmory gives nuclear shells a damage radius of 200 * tntMass = 4 m, raised to its 100 m minimum.
// Must be a plain BULLET node (no :NEEDS[]): BDArmory reads its bullet list early during loading, before
// Module Manager renames "BULLET:NEEDS[...]" to "BULLET", so a tagged node is never found.
BULLET
{
	name = BDNukes_M388
	DisplayName = M388 Davy Crockett (W54)
	caliber = 279                   // mm, warhead body diameter (the spigot sits over the 155 mm barrel)
	bulletVelocity = 300            // m/s
	bulletMass = 34.5               // kg
	//HE Bullet Values
	explosive = None
	incendiary = False
	nuclear = True
	EMP = True
	tntMass = 0.02                  // kilotons for nuclear shells: 20 tons TNT
	fuzeType = Impact
	projectileColor = 255, 242, 0, 128
	fadeColor = False
	startColor = 128, 128, 128, 0
	projectileCount = 1
	apBulletMod = 1                 // N/A
	bulletDragTypeName = AnalyticEstimate
}
