// BDNukes settings. Changes here take effect on the next game launch.
// The in-game settings window (BDNukes button on the flight toolbar) changes them live and saves to
// GameData/BDNukes/PluginData/Settings.cfg, which overrides this file. Delete that file to go back to these defaults.
BDNUKES_SETTINGS
{
	enabled = true               // master switch for the cinematic effect
	replaceStockVisuals = true   // hide BDArmory's original nuke emitters/sound (damage is never changed)

	// --- Graphics quality ---
	// Low | Medium | High | Ultra | Custom. The presets set every key in this section; Custom uses the values below.
	//   Low:    0.35x particles, half-size textures, no cap detail/collars/rings/Wilson cloud/aurora/fallout plume/
	//           lightning/scorch/fires, aggressive burst LOD, max 2500 particles per detonation
	//   Medium: 0.65x particles, everything but lightning and light shadows, max 5000
	//   High:   the values below (1.0 look), max 9000
	//   Ultra:  1.6x particles, double-size textures, light shadows, gentle burst LOD, max 20000
	quality = High
	particleDensity = 1          // particle count multiplier (0.1 - 4)
	textureScale = 1             // procedural texture resolution: 0.5, 1 or 2
	capDetail = true             // fine billows rolling over the mushroom cap
	stemCollars = true           // transient condensation collars around the stem in humid air
	condensationRings = true     // condensation rings above the fireball
	wilsonCloud = true           // brief Wilson condensation shell behind the shock (always on for underwater bursts)
	artificialAurora = true      // red/green aurora where the field lines meet the atmosphere (high-altitude bursts)
	falloutCloud = true          // fallout plume visuals (the radiation hazard is falloutRadiation below)
	lightning = true             // lightning bolts in megaton clouds
	scorchMarks = true           // burn scar and bleached ring on the ground under surface/low bursts
	lingeringFires = true        // scattered fires and smoke columns within the thermal radius on land
	lightShadows = false         // shadows from the fireball light (expensive)
	lodStrength = 0.5            // burst LOD: with N detonations active, new ones get N^-lodStrength of the particles
	maxParticles = 9000          // particle cap per detonation, including its fallout plume and fires

	// --- Atmospheric bursts ---
	sizeScale = 1                // multiplies fireball/cloud size (fireball radius ~ 70 m * yield^0.4)
	cloudHeightScale = 0.6       // mushroom cloud top ~ 5.8 km * yield^0.26; 0.6 suits Kerbin's thinner atmosphere
	cloudRiseTime = 90           // seconds for the cap to reach ~90% of its height (real life: ~5-8 minutes)
	cloudLifetime = 300          // seconds before the cloud has fully dissipated
	glowTimeScale = 1            // how long the fireball stays incandescent
	speedOfSound = 420           // shock front, boom and camera-shake speed (m/s); matches BDArmory's blast-damage timing
	lightningMinYield = 1000     // kt; bigger bursts get occasional lightning in the first minute (threshold ~30% lower in humid air)

	// --- Wind (one prevailing direction per flight scene, with a slow random veer per detonation) ---
	windSpeed = 8                // m/s near the ground; the cloud, fallout plume and smoke drift with it (0 = calm)
	windShear = 2                // wind at cloud-cap height = windSpeed * windShear (the stem leans downwind)

	// --- Fallout (surface and low bursts; dirtier for dusty surface bursts, almost none for high airbursts) ---
	falloutDuration = 600        // s the plume and the radiation last for a 20 kt burst (x (yield/20)^0.15, 0.6x - 2.5x)
	falloutRadiation = true      // gameplay: kerbals in the fallout footprint or near ground zero take a radiation dose
	falloutDoseRate = 400        // Sv/h at ground zero 60 s after a 1 kt dirty surface burst; scales with yield^0.25,
	                             // decays as t^-1.2 (Way-Wigner) and with height above the ground
	sicknessDose = 1             // Sv; warning that a kerbal has radiation sickness
	lethalDose = 6               // Sv; the kerbal dies
	probeECDrain = 0.02          // electric charge drained from probe cores, EC/s per Sv/h (0 = unmanned craft unaffected)
	geigerCounter = true         // faint Geiger crackle while the active vessel is in fallout

	// --- Ground effects ---
	scorchLifetime = 1800        // s before the burn scar has faded away
	groundAfterglow = true       // the scorched ground glows dull red for a minute or two (best seen at night)
	fireDuration = 240           // s the lingering fires burn and smoke (yield-scaled), dimming as they go

	// --- Volumetric clouds (GameData/BDNukes/Shaders, Windows / DirectX 11) ---
	volumetricClouds = true      // raymarched mushroom cloud and fluid, incandescent fireball; false = the sprite cloud
	cloudShadows = true          // the volumetric cloud casts its shadow on the ground
	cloudShadowStrength = 0.6    // how dark the shadow gets under a thick cloud (0-1)
	shockDistortion = 1          // how strongly the shock front bends the light behind it (0 = off, up to 3)
	volumetricResolution = 2     // 1 = full, 2 = half, 3 = third: the cloud is raymarched at this fraction and upsampled (big fps win)
	volumetricSteps = 64         // raymarch samples per pixel (16-128): lower it if big clouds cost too many fps

	// --- Atmosphere and weather ---
	atmosphericHaze = true       // distant clouds wash out toward the sky colour through the air in between
	hazeVisibility = 40000       // m of sea-level air that washes out ~63% of the cloud's colour (thinner air higher up)
	nukeMaxDeltaV = 120          // m/s: the most speed one nuclear blast hit can give any part (0 = no cap); a real blast
	                             // tumbles vehicles at tens of m/s, BDArmory's own can reach thousands of km/s near a big yield
	nukeImpulseScale = 0.15      // scales BDArmory's blast push from nukes only (1 = BDArmory's own, which can throw light
	                             // craft at near-orbital speed); damage is unchanged
	cloudClearing = true         // the blast blows a hole in EVE's volumetric cloud decks within reach of the shock; heals over minutes
	weatherLighting = true       // EVE volumetric overcast over ground zero takes the direct sun off the cloud below it

	// --- Terrain craters (surface and near-surface bursts on land; saved with the game) ---
	craters = true               // dig a crater: ~52 m * yield^0.294 radius (125 m at 20 kt, 400 m at 1 Mt); big airbursts too
	craterScale = 1              // multiplies crater radius and depth
	maxCraters = 100             // per body; the oldest crater is filled in beyond this
	craterPartialRebuild = true  // rebuild only the terrain quads near the crater (a few ms); false = rebuild the whole
	                             // sphere, which freezes the game for a few seconds (~3 s on Kerbin with Parallax)

	// --- Vacuum bursts ---
	vacuumPhysics = true         // realistic vacuum damage timing, no "suck-back" pull, fix stale air density
	vacuumDebrisSpeed = 4000     // debris plasma shell speed (m/s). Real shells move ~1000+ km/s; slowed so you can see it
	magneticStreamers = true     // plasma channelled along the planet's magnetic field lines

	// --- Cloud character (see ModuleNukeCloudProfile; style = auto reads the environment) ---
	tropopauseFraction = 0.16    // tropopause height as a fraction of the atmosphere depth (Kerbin: ~11 km)
	pancakeStrength = 1          // how much caps that reach the tropopause flatten and spread (0 = never)
	lowYieldThreshold = 0.1      // kt; smaller bursts make a squat dusty puff with a short stem and no rings
	waterBursts = true           // water column, spray dome, base surge and ring waves for surface/underwater bursts at sea

	// --- Regime blending on air density (kg/m^3) ---
	highAltitudeDensity = 0.05   // below this the mushroom gives way to a big red rising fireball and airglow ring
	vacuumLookDensity = 0.002    // below this the look is the pure vacuum debris shell
	regimeBlend = 0.35           // blend half-width in decades of density (0.35 = about x2.2 either side)

	// --- Many bursts ---
	mirvBus = true               // ModuleMIRVBus parts release their extra warheads
	burstLOD = true              // with N detonations active, new ones use fewer particles (see lodStrength)
	minLODScale = 0.25           // never drop below this fraction of the particles
	soundMergeWindow = 0.4       // s; skip the crack/rumble if another detonation's started this recently
	maxScreenFlash = 0.9         // cap on the combined screen flash from all detonations

	// --- Presentation ---
	billowRotationSign = 1       // set to -1 if smoke puffs look lit from the side away from the sun
	screenFlash = 1              // blinding white flash strength
	screenTint = 1               // warm orange glow over the screen while the fireball burns
	cameraShake = 1
	volume = 1
}
