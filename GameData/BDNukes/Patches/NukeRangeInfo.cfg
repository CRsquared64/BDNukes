// Effects-range readout (fireball, 20 / 5 / 1 psi, thermal, burns) in the part menu and the editor tooltip
// of every part with a BDModuleNuke, whichever mod it comes from. LAST so parts added or patched by other
// mods are covered too.
@PART[*]:HAS[@MODULE[BDModuleNuke],!MODULE[ModuleNukeRangeInfo]]:NEEDS[BDArmory]:LAST[BDNukes]
{
	MODULE
	{
		name = ModuleNukeRangeInfo
	}
}
