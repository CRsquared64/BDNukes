// Cloud character for existing nuclear parts (see ModuleNukeCloudProfile in docs/DESIGN-1.1.md).
// style = auto works the look out from where the burst happens: ground vs air, sea vs land, biome,
// humidity and the tropopause. Fields left out (or -1) come from the style or the environment.

// AIR-2 Genie (1.5 kt): unguided air-to-air rocket, almost always an airburst well clear of the ground.
// Airbursts have no dust skirt and only a thin trailing stem.
@PART[bahaAIR-2]:HAS[!MODULE[ModuleNukeCloudProfile]]:NEEDS[BDArmory]:FOR[BDNukes]
{
	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
		stemWidth = 0.7
		skirtScale = 0.6
	}
}

// GAR-11 / AIM-26 nuclear Falcon (0.25 kt): small air-to-air warhead, airburst.
@PART[bahaAIM4FalconGAR11]:HAS[!MODULE[ModuleNukeCloudProfile]]:NEEDS[BDArmory]:FOR[BDNukes]
{
	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
		stemWidth = 0.7
		skirtScale = 0.6
	}
}

// BDArmory Extended small nuclear warhead (20 kt): used for anything from ground bursts to airbursts,
// so leave the whole look to the environment.
@PART[bdWarheadSmall_N]:HAS[!MODULE[ModuleNukeCloudProfile]]:NEEDS[BDArmory]:FOR[BDNukes]
{
	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}

// BDNukes Tsar Bomba: thick column, stacked cap and backlit rim.
@PART[bdnukesTsarBomba]:HAS[!MODULE[ModuleNukeCloudProfile]]:NEEDS[BDArmory]:FOR[BDNukes]
{
	MODULE
	{
		name = ModuleNukeCloudProfile
		style = tsar
	}
}
