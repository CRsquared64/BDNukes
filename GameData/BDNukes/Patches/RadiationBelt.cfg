// Artificial radiation belts: every command part and solar panel keeps its accumulated belt dose (saved with the
// vessel), which degrades the panel's output and can make an uncrewed probe core fail. See NukeRadiationBelt.cs.
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleNukeBeltDose]]:FOR[BDNukes]
{
	MODULE
	{
		name = ModuleNukeBeltDose
	}
}

@PART[*]:HAS[@MODULE[ModuleDeployableSolarPanel],!MODULE[ModuleNukeBeltDose]]:FOR[BDNukes]
{
	MODULE
	{
		name = ModuleNukeBeltDose
	}
}
