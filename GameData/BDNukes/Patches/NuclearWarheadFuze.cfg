// The BDArmory Extended "Small Nuclear Warhead" only has a BDModuleNuke, which never triggers on its own
// (only missile modules call it). Give it a proper fuze: Arm/Disarm, Detonate button + action group,
// impact fuze, proximity fuze and an airburst altitude fuze.
@PART[bdWarheadSmall_N]:NEEDS[BDArmory]:FOR[BDNukes]
{
	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 12       // m/s relative impact speed to trigger
		detonateOnDestroyed = true // goes off if destroyed (crash, gunfire, overheat) while armed
		airburstAltitude = 0       // 0 = off; set in the editor/flight right-click menu
		maxProximityRange = 3000
		armingDelay = 3            // seconds after launch/release before impact and airburst fuzes go live
	}
}
