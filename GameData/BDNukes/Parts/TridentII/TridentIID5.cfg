// UGM-133A Trident II (D5): three-stage solid-fuel submarine-launched ballistic missile, in US and UK service since
// 1990, carried 20-24 to an Ohio- or Vanguard-class boat. 13.42 m long, 2.11 m diameter, ~59,000 kg, range
// ~12,000 km. Up to 8 Mk4A / W76-1 reentry vehicles (90-100 kt each; 100 kt used here) on a post-boost bus.
// The aerospike on the nose (shown) extends after launch to cut drag on the blunt nose fairing.
// Launch: the missile is blown out of its tube by a gas generator, breaks the surface and only then lights its
// first stage. ModuleColdLaunch does this when it's fired with its nozzle under water.
// Modelled as one part. BDArmory's boost + cruise phases stand in for the stages: boost = stage 1 (dropped with
// decoupleBoosters), cruise = stages 2 and 3 combined. agmballistic guidance and NukeBallisticCutoff handle
// range control, as on the Minuteman III. ModuleMIRVBus turns the detonation into 8 staggered bursts.
// Ideal delta-v ~2.3 km/s (stage 1, Isp 270 s) + ~3.6 km/s (stages 2/3, Isp 290 s).
//
// BDArmory limitations:
//  - Launch ranges are clamped to BDArmorySettings.MAX_ENGAGEMENT_RANGE (200 km by default).
//  - The BDArmory AI may refuse to fire a non-torpedo missile from a submerged vessel; fire it by hand or
//    with an action group. Mount it nose up on a radial or stack node inside the boat's hull.
//  - BDArmory standoff = sqrt(100) * 500 = 5 km, plus the 5 km MIRV footprint: minimum launch range 25 km.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesTridentIID5
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 1.055, 0.0, 0, 1, 0, 2
	node_stack_bottom = 0.0, 0.0, -6.71, 0, 0, -1, 2

	TechRequired = experimentalScience
	entryCost = 120000
	cost = 300000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = size2, srf
	title = UGM-133 Trident II D5 (8x W76, 100 kt)
	manufacturer = BDNukes
	description = The submarine-launched missile at the heart of the US and British deterrent. It is blown out of its launch tube by a gas generator, breaks the surface, lights its first stage in mid-air and climbs away, carrying eight 100 kiloton warheads that spread across the target area. Fire it from under water and it ejects itself first; on the surface it launches like any ICBM.
	tags = trident trident ii d5 ugm-133 ugm133 slbm submarine launched ballistic missile w76 mirv ohio vanguard nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 59
	buoyancy = 0.3
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 20
	breakingForce = 3000
	breakingTorque = 3000
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 13.42
		bodyColor = 0.88, 0.88, 0.86      // white
		shininess = 0.3
		panelLines = true
		seamSpacing = 1.4
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00            // aerospike tip
			point = 0.02, 0.025
			point = 0.70, 0.035           // spike rod
			point = 0.72, 0.18            // spike base on the blunt nose fairing
			point = 0.90, 0.48
			point = 1.20, 0.75
			point = 1.70, 0.95
			point = 2.40, 1.055
			point = 13.20, 1.055
			point = 13.42, 0.98
			point = 13.42, 0.00
		}
		BAND    // aerospike
		{
			from = 0.00
			to = 0.72
			color = 0.30, 0.30, 0.30
		}
		BAND    // nose fairing / stage 3 joint
		{
			from = 2.40
			to = 2.50
			color = 0.15, 0.15, 0.15
		}
		BAND    // stage 2 / stage 1 joint
		{
			from = 6.30
			to = 6.40
			color = 0.15, 0.15, 0.15
		}
		BAND    // stage 1 aft
		{
			from = 12.60
			to = 13.42
			color = 0.22, 0.22, 0.23
		}
		TRANSFORM    // stages 2/3 (cruise phase)
		{
			name = exhaustTransform
			position = 0, 0, -6.71
			forward = 0, 0, -1
		}
		TRANSFORM    // stage 1 (boost phase; dropped at burnout)
		{
			name = boosterExhaustTransform
			position = 0, 0, -6.71
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Trident II D5

		thrust = 1550                   // kN, stage 1
		cruiseThrust = 450              // kN, stages 2 + 3 averaged
		dropTime = 0                    // ModuleColdLaunch stretches this while ejecting from under water
		boostTime = 63
		cruiseTime = 100
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 37
		cruiseFuelMass = 16
		decoupleBoosters = true
		boosterMass = 3                 // stage 1 dry mass, removed at burnout
		boosterDecoupleSpeed = 5

		decoupleSpeed = 3
		decoupleForward = true

		audioClipPath = BDArmory/Sounds/rocketLoop
		boostClipPath = BDArmory/Sounds/launch
		boostTransformName = boosterExhaustTransform
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 3000

		aero = true
		liftArea = 0.06
		steerMult = 3
		maxTorque = 3000
		torqueRampUp = 2
		aeroSteerDamping = 6
		maxAoA = 15
		maxTurnRateDPS = 10
		vacuumSteerable = true

		missileType = missile
		homingType = agmballistic
		BallisticOverShootFactor = 0.7
		BallisticAngle = 45
		targetingType = gps
		maxOffBoresight = 180           // vertical launch
		lockedSensorFOV = 10

		minStaticLaunchRange = 25000
		maxStaticLaunchRange = 200000
		UseStaticMaxLaunchRange = true
		maxAltitude = 1000000           // non-zero so the ballistic climb is not flagged as a miss

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false

		DetonationDistance = 600        // airburst over the aim point; the other 7 RVs land around it
	}

	MODULE
	{
		name = ModuleColdLaunch
		axis = Z
		ejectSpeed = 35
		ignitionHeight = 10
		tailOffset = 6.71
		maxEjectTime = 15
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 100
		thermalRadius = 3017     // round(650 * 100^(1/3))
		fluence = 100
		isEMP = true
		reportingName = Trident II W76
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleMIRVBus
		warheads = 8
		spread = 5000
		interval = 0.6
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
