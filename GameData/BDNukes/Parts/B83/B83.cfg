// B83: US variable-yield thermonuclear gravity bomb, the most powerful weapon in the current US stockpile.
// Up to 1.2 Mt (selectable here 10 / 100 / 500 / 1200 kt). 3.7 m long, 0.46 m diameter, ~1,100 kg.
// Designed for low-level laydown delivery: a 46 ft (14 m) Kevlar ribbon chute slows it, it lands intact,
// then a delayed fuze fires a true surface burst. White case with a black impact-absorbing nose.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesB83
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.23, 0.15, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 60000
	cost = 60000
	category = none
	bdacategory = Bombs
	subcategory = 0
	bulkheadProfiles = srf
	title = B83 Laydown Bomb (10-1200 kt)
	manufacturer = BDNukes
	description = The most powerful bomb in the US stockpile, with a selectable yield of up to 1.2 megatons. It was built for low-level laydown attacks: a ribbon parachute slows it, its shock-absorbing nose lets it land intact, and a delayed fuze fires a surface burst after the bomber has gone. Set the yield, airburst height and laydown delay in the right-click menu.
	tags = b83 laydown megaton variable yield dial a yield parachute retarded surface burst nuke nuclear thermonuclear hydrogen bomb
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 1.1
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 40              // built to survive a laydown impact
	breakingForce = 300
	breakingTorque = 300
	maxTemp = 3000
	CoMOffset = 0, 0, 0.15

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 3.7
		bodyColor = 0.90, 0.90, 0.88      // white case
		shininess = 0.35
		panelLines = true
		seamSpacing = 0.9
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00
			point = 0.02, 0.07
			point = 0.07, 0.125
			point = 0.16, 0.17
			point = 0.28, 0.205
			point = 0.42, 0.225
			point = 0.55, 0.23
			point = 3.15, 0.23
			point = 3.32, 0.222
			point = 3.50, 0.205
			point = 3.65, 0.19
			point = 3.70, 0.00
		}
		BAND    // black nose (impact-absorbing nose structure)
		{
			from = 0.00
			to = 0.48
			color = 0.06, 0.06, 0.06
		}
		BAND    // centre case joint
		{
			from = 1.80
			to = 1.82
			color = 0.25, 0.25, 0.25
		}
		BAND    // parachute pack / tail section joint
		{
			from = 3.08
			to = 3.11
			color = 0.10, 0.10, 0.10
		}
		FINS    // four small tail fins
		{
			count = 4
			roll = 45
			rootFront = 3.05
			rootBack = 3.64
			tipFront = 3.36
			tipBack = 3.66
			span = 0.42
			thickness = 0.015
			color = 0.86, 0.86, 0.84
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = B83

		// unguided free-fall bomb, after BDArmory's mk82BombBrake (the retarding force comes from ModuleNukeParachute)
		thrust = 0
		cruiseThrust = 0
		dropTime = 0.3                    // BDModuleNuke refuses to detonate during Drop: keep short
		guidanceActive = false
		decoupleSpeed = 2

		useSimpleDrag = true
		simpleCoD = 0, 0, -1.6
		simpleStableTorque = 5
		rndAngVel = 0.5
		liftArea = 0

		missileType = bomb
		homingType = none
		targetingType = none

		// BDArmory's blast standoff at 1.2 Mt is ~17 km; the laydown delay is what lets a low-level
		// carrier escape, so the release range itself is kept within reach of a laydown run.
		minStaticLaunchRange = 1500
		maxStaticLaunchRange = 20000

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 1200             // kilotons; overwritten by ModuleNukeYieldSelector
		thermalRadius = 6907     // round(650 * 1200^(1/3))
		fluence = 1200
		isEMP = true
		reportingName = B83
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeYieldSelector
		yields = 10, 100, 500, 1200
		defaultIndex = 3
		thermalRadiusAtMax = 6907
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 10
		detonateOnDestroyed = true
		airburstAltitude = 0          // laydown by default; raise for a free-fall airburst
		maxAirburstAltitude = 5000
		maxProximityRange = 3000
		armingDelay = 3
		laydownDelay = 45             // s after touchdown: at 250 m/s the carrier is >11 km away, outside the 6.9 km thermal radius
		laydownMaxSpeed = 60          // m/s: touchdowns slower than this start the laydown timer
	}

	MODULE
	{
		name = ModuleNukeParachute
		canopyArea = 154              // 46 ft (14 m) Kevlar ribbon canopy: ~15 m/s descent at sea level
		dragCoefficient = 0.5         // ribbon canopy
		deployDelay = 1
		inflationTime = 1.5           // reefed opening
		riserLength = 8
		attachPoint = 0, 0, -1.85     // tail of the 3.7 m case
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
