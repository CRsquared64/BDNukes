// B57 lightweight nuclear depth / strike bomb, in US and UK service 1963-1993, carried by P-3 Orion and S-3 Viking
// ASW aircraft and SH-3 helicopters, and by fighters as a tactical bomb. 3.0 m long, 0.375 m diameter, ~230 kg.
// Variable yield (5-20 kt across the mods). As a depth bomb it was dropped, slowed by a ribbon parachute, and
// fired by a hydrostatic fuze at a preset depth; used over land it had impact and airburst fuzes.
// Modelled as a free-fall BDArmory bomb that sinks (low buoyancy) and fires on ModuleNukeFuze's depth fuze.
// Set the depth in the right-click menu; on a sea floor shallower than that it fires once it comes to rest.
// Over land the impact and airburst fuzes work as on the other bombs.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesB57
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.1875, 0.0, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 20000
	cost = 18000
	category = none
	bdacategory = Bombs
	subcategory = 0
	bulkheadProfiles = srf
	title = B57 Nuclear Depth Bomb (5-20 kt)
	manufacturer = BDNukes
	description = A light nuclear bomb carried by sub-hunting aircraft. Dropped into the sea it sinks to its set depth and goes off, crushing any submarine within a kilometre or two and heaving the surface up into a great dome of spray. Over land it works as an ordinary tactical bomb. Set the yield and the depth before release.
	tags = b57 depth bomb charge asw anti submarine p-3 orion s-3 viking underwater naval dial a yield variable yield nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 0.23
	buoyancy = 0.15                       // sinks, nose first
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 200                  // survives a water entry from a low, slow drop (no retard chute is modelled)
	maxTemp = 3000
	CoMOffset = 0, 0, 0.15

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 3.0
		bodyColor = 0.40, 0.44, 0.36      // olive drab
		shininess = 0.3
		panelLines = true
		seamSpacing = 0.75
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00    // blunt nose with its fuze
			point = 0.01, 0.04
			point = 0.03, 0.08
			point = 0.07, 0.115
			point = 0.12, 0.14
			point = 0.20, 0.163
			point = 0.30, 0.18
			point = 0.45, 0.1875
			point = 2.30, 0.1875
			point = 2.50, 0.172
			point = 2.70, 0.15    // tapered tail
			point = 2.85, 0.128
			point = 2.95, 0.11
			point = 2.95, 0.11
			point = 2.95, 0.075   // parachute pack cover
			point = 2.95, 0.075
			point = 3.00, 0.07
			point = 3.00, 0.00
		}
		BAND    // nose
		{
			from = 0.0
			to = 0.3
			color = 0.30, 0.33, 0.27
		}
		BAND    // fuze
		{
			from = 0.0
			to = 0.05
			color = 0.20, 0.21, 0.19
		}
		BAND    // yellow ordnance band
		{
			from = 0.5
			to = 0.56
			color = 0.90, 0.75, 0.15
		}
		BAND    // case joint
		{
			from = 1.1
			to = 1.12
			color = 0.20, 0.22, 0.18
		}
		BAND    // case joint
		{
			from = 1.9
			to = 1.92
			color = 0.20, 0.22, 0.18
		}
		BAND    // parachute tail section
		{
			from = 2.3
			to = 3.0
			color = 0.30, 0.33, 0.27
		}
		BAND    // parachute pack cover
		{
			from = 2.95
			to = 3.0
			color = 0.18, 0.19, 0.16
		}
		FINS    // four small tail fins
		{
			count = 4
			roll = 45
			rootFront = 2.45
			rootBack = 2.94
			tipFront = 2.7
			tipBack = 2.98
			span = 0.22
			thickness = 0.01
			color = 0.30, 0.33, 0.27
		}
		FINS    // forward suspension lug
		{
			count = 1
			roll = 90
			rootFront = 1.3
			rootBack = 1.36
			tipFront = 1.31
			tipBack = 1.35
			span = 0.215
			thickness = 0.03
			color = 0.20, 0.21, 0.19
		}
		FINS    // aft suspension lug
		{
			count = 1
			roll = 90
			rootFront = 1.66
			rootBack = 1.72
			tipFront = 1.67
			tipBack = 1.71
			span = 0.215
			thickness = 0.03
			color = 0.20, 0.21, 0.19
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = B57

		// unguided free-fall bomb: no guidance, so BDArmory never calls it a miss and blows it early
		thrust = 0
		cruiseThrust = 0
		dropTime = 0.5                    // BDModuleNuke refuses to detonate during Drop
		boostTime = 0
		cruiseTime = 300                  // long enough to sink to depth
		guidanceActive = false

		missileType = bomb
		homingType = none
		targetingType = none
		DetonationDistance = 0

		aero = true
		liftArea = 0.003
		steerMult = 2
		maxTorque = 4

		decoupleSpeed = 2

		minStaticLaunchRange = 3000       // BDArmory blast standoff at the 20 kt setting
		maxStaticLaunchRange = 10000

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = true
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 10               // kilotons; overwritten by ModuleNukeYieldSelector
		thermalRadius = 1400     // round(650 * 10^(1/3))
		fluence = 10
		isEMP = true
		reportingName = B57
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeYieldSelector
		yields = 5, 10, 15, 20
		defaultIndex = 1
		thermalRadiusAtMax = 1764        // round(650 * 20^(1/3))
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true                // over land; water entry is not a collision, so it sinks on
		impactFuzeSpeed = 10
		detonateOnDestroyed = true
		airburstAltitude = 0             // off by default: as a depth bomb it must reach the water
		maxAirburstAltitude = 3000
		maxProximityRange = 3000
		depthFuze = 100                  // m below sea level
		maxDepthFuze = 600
		armingDelay = 3
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
