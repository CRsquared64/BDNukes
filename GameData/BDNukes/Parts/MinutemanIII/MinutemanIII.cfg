// LGM-30G Minuteman III with a single Mk21 / W87 (300 kt): three-stage solid-fuel silo-launched ICBM,
// in US service since 1970. 18.3 m long, 1.67 m first-stage diameter (1.33 m upper stages), ~35,300 kg.
// Stage 1 M55 (~790 kN, ~60 s), stage 2 SR19 (~270 kN, ~66 s), stage 3 SR73 (~150 kN, ~61 s), then the
// post-boost vehicle under a conical shroud. Real range ~13,000 km.
// Modelled as one part. BDArmory's boost + cruise phases stand in for the stages: boost = stage 1 (dropped with
// decoupleBoosters), cruise = stages 2 and 3 combined. agmballistic guidance throttles the motor to reach
// a free-fall trajectory to the target.
// Ideal delta-v: stage 1 2.0 km/s (Isp 232 s, T/W 2.3) + stages 2/3 4.3 km/s (Isp 283 s) = 6.3 km/s, the real
// missile's ~7 km/s burnout class. That is far more than the ~1.5-2 km/s a 200 km lob needs on Kerbin, so the
// motor is cut once the drag-free trajectory reaches the target (NukeBallisticCutoff, via ModuleNukeCloudProfile).
//
// BDArmory limitations:
//  - Launch ranges are clamped to BDArmorySettings.MAX_ENGAGEMENT_RANGE (200 km by default, in BDArmory's
//    settings.cfg); the weapon manager's guard range is clamped to MAX_GUARD_VISUAL_RANGE (200 km). An AI can
//    only fire it at targets it has detected inside that distance (radar, data link or GPS coordinates).
//  - agmballistic guidance (BallisticGuidance) assumes flat ground and constant gravity, so impact accuracy
//    drops at the longest ranges on a small planet.
//  - KSP only simulates vessels inside the physics range; BDArmory can extend it.
//  - BDArmory standoff = sqrt(300) * 500 = 8.7 km; the warhead stays NotSafe until ~10.8 km from the launcher.
// Launch it vertically: stand it on its bottom node on a pad, or radially from a vertical mount.
// For the separable reentry vehicle on your own rocket, use the "Mk21 Reentry Vehicle" part (bdnukesMk21RV).
PART:NEEDS[BDArmory]
{
	name = bdnukesMinutemanIII
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (first stage radius 0.835 m at the part centre)
	node_attach = 0.0, 0.835, 0.0, 0, 1, 0, 2
	node_stack_bottom = 0.0, 0.0, -9.15, 0, 0, -1, 2

	TechRequired = experimentalScience
	entryCost = 120000
	cost = 250000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = size2, srf
	title = LGM-30G Minuteman III (W87, 300 kt)
	manufacturer = BDNukes
	description = The silo-based backbone of the US land-based nuclear deterrent since 1970. Three solid-fuel stages throw a post-boost vehicle and its reentry vehicle on a ballistic arc; here it carries a single Mk21 with the 300 kiloton W87. It is launched vertically and flies itself onto a ballistic trajectory toward the target.
	tags = minuteman lgm-30 lgm30 icbm ballistic missile w87 mk21 nuke nuclear silo
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 35.3
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 2000
	breakingTorque = 2000
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 18.3
		bodyColor = 0.92, 0.92, 0.90      // white stages
		shininess = 0.3
		panelLines = true
		seamSpacing = 1.5
		collider = capsule
		segments = 64
		PROFILE
		{
			point = 0.00, 0.00    // blunt-tipped conical payload shroud
			point = 0.02, 0.04
			point = 0.05, 0.06
			point = 0.12, 0.085
			point = 0.25, 0.115
			point = 0.40, 0.14
			point = 1.60, 0.38
			point = 2.80, 0.62
			point = 2.95, 0.645
			point = 3.10, 0.66
			point = 3.20, 0.665
			point = 5.42, 0.665   // stage 3 / stage 2 joint groove
			point = 5.42, 0.665
			point = 5.42, 0.655
			point = 5.42, 0.655
			point = 5.55, 0.655
			point = 5.55, 0.655
			point = 5.55, 0.665
			point = 5.55, 0.665
			point = 9.60, 0.665   // stages 3 and 2 (1.33 m)
			point = 9.95, 0.835   // interstage flare to stage 1 (1.67 m)
			point = 18.05, 0.835
			point = 18.10, 0.82
			point = 18.10, 0.82
			point = 18.10, 0.42   // aft closure
			point = 18.10, 0.42
			point = 18.14, 0.30   // nozzle throat
			point = 18.22, 0.43
			point = 18.30, 0.58   // nozzle exit
			point = 18.30, 0.00
		}
		BAND    // black shroud
		{
			from = 0.0
			to = 3.2
			color = 0.12, 0.12, 0.13
		}
		BAND    // shroud joint
		{
			from = 3.2
			to = 3.24
			color = 0.20, 0.20, 0.20
		}
		BAND    // stage 3 / stage 2 joint
		{
			from = 5.4
			to = 5.57
			color = 0.15, 0.15, 0.15
		}
		BAND    // interstage
		{
			from = 9.55
			to = 9.95
			color = 0.15, 0.15, 0.15
		}
		BAND    // stage 1 case seam
		{
			from = 13.3
			to = 13.34
			color = 0.30, 0.30, 0.30
		}
		BAND    // stage 1 dark aft section
		{
			from = 16.8
			to = 18.1
			color = 0.22, 0.22, 0.23
		}
		BAND    // nozzle
		{
			from = 18.1
			to = 18.3
			color = 0.09, 0.09, 0.10
		}
		FINS    // stage 2/3 cable raceways
		{
			count = 2
			roll = 0
			rootFront = 3.4
			rootBack = 9.4
			tipFront = 3.42
			tipBack = 9.38
			span = 0.7
			thickness = 0.06
			color = 0.85, 0.85, 0.83
		}
		FINS    // stage 1 cable raceways (dropped with the stage)
		{
			count = 2
			roll = 0
			rootFront = 10.1
			rootBack = 17.9
			tipFront = 10.12
			tipBack = 17.88
			span = 0.87
			thickness = 0.08
			color = 0.85, 0.85, 0.83
			parent = boosterStage
		}
		TRANSFORM                         // stage 2/3 exhaust (cruise phase)
		{
			name = exhaustTransform
			position = 0, 0, -0.45
			forward = 0, 0, -1
		}
		TRANSFORM                         // stage 1 body: dropped whole at boost burnout (boostTransformName), nozzles and fins with it
		{
			name = boosterStage
			position = 0, 0, -0.45
			forward = 0, 0, -1
			detach = 9.6, 18.3
		}
		TRANSFORM                         // stage 1 exhaust (boost phase; dropped at burnout)
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0, 0, -9.15
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Minuteman III

		thrust = 790                    // kN, M55 first stage
		cruiseThrust = 220              // kN, SR19 + SR73 averaged
		dropTime = 0                    // <= 0.5 s: BDModuleNuke will not detonate in the Drop state
		boostTime = 60
		cruiseTime = 120
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 20.8
		cruiseFuelMass = 9.5
		decoupleBoosters = true
		boosterMass = 2.4               // stage 1 dry mass, removed at burnout
		boosterDecoupleSpeed = 5

		decoupleSpeed = 3
		decoupleForward = true

		audioClipPath = BDNukes/Sounds/bdnukes_heavy_motor_loop
		boostClipPath = BDNukes/Sounds/bdnukes_heavy_motor_loop
		boostTransformName = boosterStage
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 3000

		aero = true
		liftArea = 0.05
		steerMult = 3
		maxTorque = 1500
		torqueRampUp = 2
		aeroSteerDamping = 6
		maxAoA = 15
		maxTurnRateDPS = 10
		vacuumSteerable = true

		missileType = missile
		homingType = agmballistic
		BallisticOverShootFactor = 0.7
		BallisticAngle = 45
		targetingType = gps
		maxOffBoresight = 180           // vertical launch
		lockedSensorFOV = 10

		// standoff 8.7 km; max clamped to MAX_ENGAGEMENT_RANGE (200 km by default)
		minStaticLaunchRange = 25000
		maxStaticLaunchRange = 200000
		UseStaticMaxLaunchRange = true
		maxAltitude = 1000000           // non-zero so the ballistic climb is not flagged as a miss

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false

		DetonationDistance = 800        // airburst over the target
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 300
		thermalRadius = 4351
		fluence = 300
		isEMP = true
		reportingName = W87 Minuteman III
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		exhaustSmoke = 0.35            // BDArmory largeExhaust smoke piles up round the pad
		style = auto
	}
}
