// Mk21 reentry vehicle with the W87 warhead (300 kt), carried by Minuteman III (and formerly Peacekeeper).
// A slender carbon-phenolic cone ~1.75 m long and ~0.55 m across the base, ~360 kg (sources vary).
// A standalone part for your own rockets or BDModularGuidance missiles: it stacks on its bottom node, nose up.
// It has no decoupler of its own (ModuleNukeFuze force-activates the part, which would fire a stock
// ModuleDecouple on spawn): put a decoupler under it.
// Arm it (BDArmory warhead Arm), then it detonates on its airburst altitude fuze while descending, on impact,
// on proximity, or if destroyed. Stock ModuleAblator + Ablator protect it during reentry.
PART:NEEDS[BDArmory]
{
	name = bdnukesMk21RV
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// Vertical stack part: nose along +Y, centred, so the base is at -0.875
	node_stack_bottom = 0.0, -0.875, 0.0, 0, -1, 0, 1
	node_attach = 0.0, -0.875, 0.0, 0, -1, 0, 1

	TechRequired = experimentalScience
	entryCost = 40000
	cost = 60000
	category = none
	bdacategory = Warheads
	subcategory = 0
	bulkheadProfiles = size0, srf
	title = Mk21 Reentry Vehicle (W87, 300 kt)
	manufacturer = BDNukes
	description = The reentry vehicle of the Minuteman III, a slender ablative cone that protects the 300 kiloton W87 warhead through reentry at around 7 km/s. Put it on top of any rocket or BDArmory modular missile, arm it and set the airburst altitude or rely on the impact fuze. Above about 1.5 km/s in the atmosphere it trails a glowing plasma sheath.
	tags = mk21 mk-21 rv reentry vehicle w87 minuteman icbm warhead nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,0,0

	mass = 0.31                         // + 0.05 t Ablator = 0.36 t
	dragModelType = default
	maximum_drag = 0.05
	minimum_drag = 0.05
	angularDrag = 1
	crashTolerance = 20
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 2400
	skinMaxTemp = 3300
	emissiveConstant = 0.9
	thermalMassModifier = 1.0

	MODULE
	{
		name = ModuleProceduralModel
		axis = Y
		length = 1.75
		bodyColor = 0.13, 0.12, 0.11      // dark carbon-phenolic ablative
		shininess = 0.08
		panelLines = false
		seamSpacing = 0
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00            // small blunt nosetip
			point = 0.02, 0.02
			point = 0.06, 0.03
			point = 1.68, 0.275           // ~8 deg half-angle cone
			point = 1.75, 0.255           // rounded base shoulder
			point = 1.75, 0.00
		}
		BAND                              // graphite nosetip
		{
			from = 0.00
			to = 0.07
			color = 0.24, 0.23, 0.22
		}
		BAND                              // base ring
		{
			from = 1.66
			to = 1.75
			color = 0.20, 0.19, 0.18
		}
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 300
		thermalRadius = 4351
		fluence = 300
		isEMP = true
		reportingName = W87 Mk21 RV
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 50
		detonateOnDestroyed = true
		airburstAltitude = 1800          // a typical height of burst for 300 kt; 0 = surface burst on impact
		maxAirburstAltitude = 5000
		maxProximityRange = 3000
		armingDelay = 15                 // keeps it safe through launch; the airburst fuze only fires while descending
	}

	MODULE
	{
		name = ModuleReentryVehicle
		plasmaMinSpeed = 1500
		plasmaScale = 1
		spinRate = 0                     // the real RV is spun up by the bus; off here so it doesn't upset player rockets
	}

	MODULE
	{
		name = ModuleAblator
		ablativeResource = Ablator
		lossExp = -7500
		lossConst = 0.1
		pyrolysisLossFactor = 6000
		reentryConductivity = 0.01
		ablationTempThresh = 500
	}

	RESOURCE
	{
		name = Ablator
		amount = 50
		maxAmount = 50
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
