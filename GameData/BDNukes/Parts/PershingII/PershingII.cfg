// MGM-31C Pershing II: two-stage solid-fuel road-mobile intermediate-range ballistic missile, US Army in West Germany
// 1983-1991, removed under the INF Treaty. 10.6 m long, 1.02 m diameter, ~7,400 kg, range ~1,770 km.
// W85 variable-yield warhead (5-80 kt) in a maneuvering reentry vehicle: its RADAG radar compared the ground below
// with stored maps in the terminal dive and steered with small fins, for ~30 m CEP.
// Modelled as one part: boost = stage 1 (dropped with decoupleBoosters), cruise = stage 2. agmballistic guidance and
// NukeBallisticCutoff do the range control; BDArmory's GPS terminal homing stands in for RADAG.
// Ideal delta-v ~2.1 km/s (stage 1, Isp 260 s) + ~2.3 km/s (stage 2, Isp 270 s).
// BDArmory limits: launch range clamped to MAX_ENGAGEMENT_RANGE (200 km by default); standoff at the 80 kt setting
// sqrt(80) * 500 = 4.5 km. Launch it vertically, standing on its bottom node (on a truck's erector, say).
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesPershingII
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.51, 0.0, 0, 1, 0, 1
	node_stack_bottom = 0.0, 0.0, -5.3, 0, 0, -1, 1

	TechRequired = experimentalScience
	entryCost = 60000
	cost = 90000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = size1, srf
	title = MGM-31C Pershing II (W85, 5-80 kt)
	manufacturer = BDNukes
	description = A fast, accurate road-mobile missile that could reach its target only minutes after launch, which is why it frightened the Soviet leadership so much. Its reentry vehicle steers itself in the final dive by matching radar images of the ground with stored maps. Set the yield, give it a GPS target and launch it vertically.
	tags = pershing pershing ii mgm-31 mgm31 irbm ballistic missile w85 marv road mobile dial a yield variable yield nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 7.4
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 800
	breakingTorque = 800
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 10.6
		bodyColor = 0.30, 0.34, 0.24      // US Army olive drab
		shininess = 0.25
		panelLines = true
		seamSpacing = 1.2
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00            // sharp radar-nose cone of the MaRV
			point = 0.05, 0.04
			point = 1.40, 0.30
			point = 2.80, 0.48
			point = 3.00, 0.51
			point = 10.40, 0.51
			point = 10.60, 0.46
			point = 10.60, 0.00
		}
		BAND    // radome tip
		{
			from = 0.00
			to = 0.45
			color = 0.20, 0.20, 0.18
		}
		BAND    // RV / stage 2 joint
		{
			from = 2.95
			to = 3.05
			color = 0.12, 0.12, 0.12
		}
		BAND    // stage 2 / stage 1 joint
		{
			from = 6.40
			to = 6.50
			color = 0.12, 0.12, 0.12
		}
		FINS    // MaRV control vanes
		{
			count = 4
			roll = 45
			rootFront = 2.35
			rootBack = 2.90
			tipFront = 2.65
			tipBack = 2.90
			span = 0.14
			thickness = 0.012
			color = 0.25, 0.28, 0.20
		}
		FINS    // stage 1 tail fins
		{
			count = 4
			roll = 45
			parent = boosterStage
			rootFront = 9.70
			rootBack = 10.55
			tipFront = 10.20
			tipBack = 10.55
			span = 0.35
			thickness = 0.02
			color = 0.25, 0.28, 0.20
		}
		TRANSFORM    // stage 2 (cruise phase)
		{
			name = exhaustTransform
			position = 0, 0, -1.15
			forward = 0, 0, -1
		}
		TRANSFORM                         // stage 1 body: dropped whole at boost burnout (boostTransformName), nozzles and fins with it
		{
			name = boosterStage
			position = 0, 0, -1.15
			forward = 0, 0, -1
			detach = 6.45, 10.6
		}
		TRANSFORM    // stage 1 (boost phase; dropped at burnout)
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0, 0, -5.3
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Pershing II

		thrust = 186                    // kN, stage 1
		cruiseThrust = 120              // kN, stage 2
		dropTime = 0                    // <= 0.5 s: BDModuleNuke will not detonate in the Drop state
		boostTime = 55
		cruiseTime = 55
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 4.0
		cruiseFuelMass = 2.5
		decoupleBoosters = true
		boosterMass = 0.6
		boosterDecoupleSpeed = 5

		decoupleSpeed = 3
		decoupleForward = true

		audioClipPath = BDArmory/Sounds/rocketLoop
		boostClipPath = BDArmory/Sounds/launch
		boostTransformName = boosterStage
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 2500

		aero = true
		liftArea = 0.02
		steerMult = 3
		maxTorque = 400
		torqueRampUp = 2
		aeroSteerDamping = 6
		maxAoA = 20
		maxTurnRateDPS = 12             // the MaRV can pull harder in the terminal dive
		vacuumSteerable = true

		missileType = missile
		homingType = agmballistic
		BallisticOverShootFactor = 0.7
		BallisticAngle = 45
		targetingType = gps
		maxOffBoresight = 180           // vertical launch
		lockedSensorFOV = 10

		minStaticLaunchRange = 10000
		maxStaticLaunchRange = 200000
		UseStaticMaxLaunchRange = true
		maxAltitude = 1000000           // non-zero so the ballistic climb is not flagged as a miss

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false

		DetonationDistance = 250        // low airburst; set a yield to suit the target
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 80               // kilotons; overwritten by ModuleNukeYieldSelector
		thermalRadius = 2801     // round(650 * 80^(1/3))
		fluence = 80
		isEMP = true
		reportingName = Pershing II
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeYieldSelector
		yields = 5, 10, 20, 40, 80
		defaultIndex = 4
		thermalRadiusAtMax = 2801
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
