// R-36M2 "Voevoda" (NATO SS-18 Mod 6 "Satan"), single-warhead variant: the same two-stage liquid-fuel heavy ICBM
// as the MIRV version (34.3 m, 3.0 m diameter, ~211,400 kg) carrying one very large reentry vehicle, reported at
// ~20 Mt. Stage 1 RD-264 (four chambers, 4,520 kN vac, ~100 s on 147 t at Isp ~313 s), stage 2 RD-0255 (~755 kN,
// ~165 s on 37 t at Isp ~343 s). Ideal delta-v 3.65 + 3.71 = 7.4 km/s (the real ~7.5 km/s burnout class); far
// more than a 200 km Kerbin lob needs, so agmballistic's throttle-back does the range control.
// Modelled as one part. BDArmory's boost + cruise phases stand in for the two stages (stage 1 is dropped with
// decoupleBoosters). No MIRV bus.
//
// BDArmory limitations:
//  - Launch ranges are clamped to BDArmorySettings.MAX_ENGAGEMENT_RANGE (200 km by default, in BDArmory's
//    settings.cfg); the weapon manager's guard range is clamped to MAX_GUARD_VISUAL_RANGE (200 km). An AI can
//    only fire it at targets it has detected inside that distance (radar, data link or GPS coordinates).
//  - agmballistic guidance (BallisticGuidance) assumes flat ground and constant gravity, so impact accuracy
//    drops at the longest ranges on a small planet.
//  - KSP only simulates vessels inside the physics range; BDArmory can extend it.
//  - BDArmory standoff = sqrt(20000) * 500 = 70.7 km and the warhead stays NotSafe until ~88 km from the
//    launcher, so the minimum launch range is 100 km (the usable window is 100-200 km).
//  - A 211 t, 34 m single part: stand it on its bottom node on a sturdy pad. No BDArmory VLS cell fits it.
PART:NEEDS[BDArmory]
{
	name = bdnukesR36M2Mod6
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (radius 1.5 m)
	node_attach = 0.0, 1.5, 0.0, 0, 1, 0, 3
	node_stack_bottom = 0.0, 0.0, -17.15, 0, 0, -1, 3

	TechRequired = experimentalScience
	entryCost = 250000
	cost = 800000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = size3, srf
	title = R-36M2 Voevoda / SS-18 Mod 6 Satan (20 Mt)
	manufacturer = BDNukes
	description = The heaviest ICBM ever deployed, in its single-warhead form: one reentry vehicle reported at about 20 megatons, the largest warhead carried by any deployed missile. The cloud approaches Tsar Bomba scale, climbing some 45 km. It is cold-launched vertically and flies itself onto a ballistic trajectory toward the target.
	tags = r-36m2 r36m2 r-36 voevoda satan ss-18 ss18 mod6 icbm ballistic soviet russian nuke nuclear megaton
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 211.4
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 8000
	breakingTorque = 8000
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 34.3
		bodyColor = 0.26, 0.33, 0.22      // Soviet dark green
		shininess = 0.2
		panelLines = true
		seamSpacing = 2.0
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00            // ogival nose shroud over the single RV
			point = 0.20, 0.18
			point = 1.00, 0.55
			point = 2.20, 0.95
			point = 3.60, 1.25
			point = 5.00, 1.43
			point = 6.20, 1.50
			point = 34.00, 1.50           // stages 2 and 1, 3.0 m
			point = 34.30, 1.38
			point = 34.30, 0.00
		}
		BAND                              // shroud / stage 2 joint
		{
			from = 6.20
			to = 6.60
			color = 0.92, 0.92, 0.90
		}
		BAND                              // stage 2 / stage 1 joint
		{
			from = 11.80
			to = 12.20
			color = 0.92, 0.92, 0.90
		}
		BAND                              // stage 1 band
		{
			from = 23.00
			to = 23.40
			color = 0.92, 0.92, 0.90
		}
		BAND                              // aft skirt
		{
			from = 33.60
			to = 34.30
			color = 0.20, 0.25, 0.17
		}
		TRANSFORM                         // stage 2 RD-0255 (cruise phase)
		{
			name = exhaustTransform
			position = 0, 0, 5.15
			forward = 0, 0, -1
		}
		TRANSFORM                         // stage 1 body: dropped whole at boost burnout (boostTransformName), nozzles and fins with it
		{
			name = boosterStage
			position = 0, 0, 5.15
			forward = 0, 0, -1
			detach = 12.0, 34.3
		}
		TRANSFORM                         // stage 1 RD-264, four chambers (boost phase; dropped at burnout)
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0.75, 0, -17.15
			forward = 0, 0, -1
		}
		TRANSFORM
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = -0.75, 0, -17.15
			forward = 0, 0, -1
		}
		TRANSFORM
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0, 0.75, -17.15
			forward = 0, 0, -1
		}
		TRANSFORM
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0, -0.75, -17.15
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = R-36M2 Mod 6

		thrust = 4520                   // kN, RD-264
		cruiseThrust = 755              // kN, RD-0255
		dropTime = 0                    // <= 0.5 s: BDModuleNuke will not detonate in the Drop state
		boostTime = 100
		cruiseTime = 165
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 147
		cruiseFuelMass = 37
		decoupleBoosters = true
		boosterMass = 9                 // stage 1 dry mass, removed at burnout
		boosterDecoupleSpeed = 5

		decoupleSpeed = 3
		decoupleForward = true

		audioClipPath = BDArmory/Sounds/rocketLoop
		boostClipPath = BDArmory/Sounds/launch
		boostTransformName = boosterStage
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust

		optimumAirspeed = 3000

		aero = true
		liftArea = 0.3
		steerMult = 3
		maxTorque = 30000
		torqueRampUp = 2
		aeroSteerDamping = 6
		maxAoA = 15
		maxTurnRateDPS = 8
		vacuumSteerable = true

		missileType = missile
		homingType = agmballistic
		BallisticOverShootFactor = 0.7
		BallisticAngle = 45
		targetingType = gps
		maxOffBoresight = 180           // vertical launch
		lockedSensorFOV = 10

		// standoff 70.7 km, NotSafe until ~88 km; max clamped to MAX_ENGAGEMENT_RANGE (200 km by default)
		minStaticLaunchRange = 100000
		maxStaticLaunchRange = 200000
		UseStaticMaxLaunchRange = true
		maxAltitude = 1000000           // non-zero so the ballistic climb is not flagged as a miss

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false

		DetonationDistance = 2000       // high airburst over the aim point
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 20000
		thermalRadius = 17644
		fluence = 20000
		isEMP = true
		reportingName = R-36M2 Mod 6
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = tsar
	}
}
