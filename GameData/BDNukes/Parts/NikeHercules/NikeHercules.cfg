// MIM-14 Nike Hercules with the W31 warhead (20 kt): two-stage, radar command-guided surface-to-air missile,
// US Army 1958-1984. 12.5 m long, ~4,860 kg at launch. Booster: four M5E1 (Nike Ajax) solid motors clustered
// under one big cruciform fin set, ~3.4 s burn. Sustainer: 0.8 m body, four long-chord delta wings (~2.3 m span)
// and four small nose control fins, ~29 s burn, Mach ~3.65, ~140 km slant range, ceiling ~45 km.
// The whole missile is one part; BDArmory's decoupleBoosters drops the booster mass (and the booster exhaust)
// at burnout, but the procedural booster mesh stays on (ModuleProceduralModel has no separable sub-mesh).
// Adapted from BDArmory's MIM-104 PAC-3 (bahaPac-3) and BDArmory Extended's SA-30 heavy SAM (bahaHSAM).
// Mount it pointing up (or near vertical, like the real 85 deg launcher) on a ground vessel with a radar
// and a weapon manager. No dedicated launcher part is needed: MissileLauncher decouples from any parent.
PART:NEEDS[BDArmory]
{
	name = bdnukesNikeHercules
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (sustainer radius 0.40 m at the part centre)
	node_attach = 0.0, 0.40, 0.0, 0, 1, 0, 1
	node_stack_bottom = 0.0, 0.0, -6.25, 0, 0, -1, 1

	TechRequired = precisionEngineering
	entryCost = 24000
	cost = 18000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = srf
	title = MIM-14 Nike Hercules (W31, 20 kt)
	manufacturer = BDNukes
	description = The US Army's nuclear-armed surface-to-air missile, deployed around American and NATO cities from 1958 to protect them from bomber formations. A cluster of four solid boosters throws it off the launcher, then the sustainer carries the 20 kiloton W31 warhead to Mach 3.6 and up to about 140 km under ground radar command guidance. One airburst was meant to destroy a whole formation.
	tags = nike hercules mim-14 mim14 w31 sam surface air missile nuke nuclear army
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 4.86
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 500
	breakingTorque = 500
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 12.5
		bodyColor = 0.93, 0.93, 0.91      // US Army white
		shininess = 0.35
		panelLines = true
		seamSpacing = 1.2
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00            // sharp ogive nose
			point = 0.25, 0.07
			point = 0.80, 0.19
			point = 1.60, 0.30
			point = 2.60, 0.37
			point = 3.40, 0.40
			point = 7.90, 0.40            // sustainer body, 0.8 m
			point = 8.10, 0.36            // sustainer boattail / nozzle in the booster adapter
			point = 8.25, 0.36
			point = 8.45, 0.52            // booster adapter flares out to the 4-motor cluster
			point = 12.30, 0.52
			point = 12.48, 0.46           // four nozzles approximated by a short boattail
			point = 12.50, 0.00
		}
		BAND                              // black radome / fuze tip
		{
			from = 0.00
			to = 0.18
			color = 0.10, 0.10, 0.10
		}
		BAND                              // warhead section marker
		{
			from = 2.30
			to = 2.38
			color = 0.85, 0.70, 0.10
		}
		BAND                              // sustainer / booster joint
		{
			from = 8.05
			to = 8.45
			color = 0.20, 0.20, 0.20
		}
		BAND                              // booster nozzle ring
		{
			from = 12.30
			to = 12.50
			color = 0.18, 0.18, 0.18
		}
		FINS                              // small forward control fins
		{
			count = 4
			roll = 45
			rootFront = 1.25
			rootBack = 1.95
			tipFront = 1.70
			tipBack = 1.95
			span = 0.72
			thickness = 0.03
			color = 0.90, 0.90, 0.88
		}
		FINS                              // long-chord delta wings, ~2.3 m span
		{
			count = 4
			roll = 45
			rootFront = 3.60
			rootBack = 7.90
			tipFront = 7.35
			tipBack = 7.90
			span = 1.15
			thickness = 0.05
			color = 0.90, 0.90, 0.88
		}
		FINS                              // big booster fins, ~3.5 m span
		{
			count = 4
			roll = 45
			rootFront = 10.70
			rootBack = 12.45
			tipFront = 11.55
			tipBack = 12.50
			span = 1.75
			thickness = 0.06
			color = 0.90, 0.90, 0.88
		}
		TRANSFORM                         // sustainer nozzle (cruise exhaust)
		{
			name = exhaustTransform
			position = 0, 0, -1.9
			forward = 0, 0, -1
		}
		TRANSFORM                         // booster cluster nozzles (boost exhaust; dropped at burnout)
		{
			name = boosterExhaustTransform
			position = 0, 0, -6.3
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Nike Hercules

		thrust = 1090                   // kN, four M5E1 boosters
		cruiseThrust = 45               // kN, sustainer
		dropTime = 0                    // <= 0.5 s: BDModuleNuke will not detonate in the Drop state
		boostTime = 3.4
		cruiseTime = 29
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 1.55
		cruiseFuelMass = 0.70
		decoupleBoosters = true
		boosterMass = 0.85              // booster cluster dry mass, removed at burnout
		boosterDecoupleSpeed = 5

		decoupleSpeed = 5
		decoupleForward = true

		audioClipPath = BDArmory/Sounds/rocketLoop
		boostClipPath = BDArmory/Sounds/launch
		boostTransformName = boosterExhaustTransform
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 1200

		aero = true
		liftArea = 0.035
		steerMult = 5
		maxTorque = 150
		torqueRampUp = 4
		aeroSteerDamping = 4
		maxAoA = 25
		gLimit = 15

		missileType = missile
		homingType = aam
		pronavGain = 4
		targetingType = radar           // the real missile was command-guided by the battery's ground radars
		activeRadarRange = 20000
		radarLOAL = true
		maxOffBoresight = 180           // launched near-vertical
		lockedSensorFOV = 7
		chaffEffectivity = 0.6

		// BDArmory standoff = sqrt(20) * 500 = 2236 m, and the warhead stays safe until 1.25x that from the launcher.
		minStaticLaunchRange = 5000
		maxStaticLaunchRange = 140000
		maxAltitude = 60000             // non-zero so the climb to altitude is not flagged as a miss

		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false

		DetonationDistance = 400        // proximity (command) burst, a few hundred metres from the target
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 20
		thermalRadius = 1764
		fluence = 20
		isEMP = true
		reportingName = W31 Nike Hercules
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto                    // usually a high air burst: free fireball and smoke ring, no stem
	}
}
