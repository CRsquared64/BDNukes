// MIM-14 Nike Hercules with the W31 warhead (20 kt): two-stage, radar command-guided surface-to-air missile,
// US Army 1958-1984. 12.5 m long, ~4,860 kg at launch (designation-systems.net). Booster (M42): four M5E1 (Nike Ajax)
// solid motors, 0.80 m cluster, 4.34 m, 2,345 kg, 978 kN, ~3.4 s burn, 3.5 m fin span. Sustainer: Thiokol M30,
// 44.4 kN, ~29 s; 8.18 m, 0.53 m (21 in) body, 2,505 kg, delta wings 1.88 m span, small nose control fins.
// Mach ~3.65, ~140 km slant range, ceiling ~45 km.
// Ideal delta-v: boost 807 m/s (Isp 242 s, 20 g at launch) + sustainer 581 m/s (Isp 230 s) = 1.39 km/s,
// ~1.1 km/s after gravity losses in a vertical climb: Mach 3.5 class.
// The whole missile is one part; BDArmory's decoupleBoosters drops the booster mass (and the booster exhaust)
// at burnout, but the procedural booster mesh stays on (ModuleProceduralModel has no separable sub-mesh).
// Adapted from BDArmory's MIM-104 PAC-3 (bahaPac-3) and BDArmory Extended's SA-30 heavy SAM (bahaHSAM).
// Mount it pointing up (or near vertical, like the real 85 deg launcher) on a ground vessel with a radar
// and a weapon manager. No dedicated launcher part is needed: MissileLauncher decouples from any parent.
PART:NEEDS[BDArmory]
{
	name = bdnukesNikeHercules
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (sustainer radius 0.265 m at the part centre)
	node_attach = 0.0, 0.265, 0.0, 0, 1, 0, 1
	node_stack_bottom = 0.0, 0.0, -6.25, 0, 0, -1, 1

	TechRequired = precisionEngineering
	entryCost = 24000
	cost = 18000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = srf
	title = MIM-14 Nike Hercules (W31, 20 kt)
	manufacturer = BDNukes
	description = The US Army's nuclear-armed surface-to-air missile, deployed around American and NATO cities from 1958 to protect them from bomber formations. A cluster of four solid boosters throws it off the launcher, then the sustainer carries the 20 kiloton W31 warhead to Mach 3.6 and up to about 140 km under ground radar command guidance. One airburst was meant to destroy a whole formation.
	tags = nike hercules mim-14 mim14 w31 sam surface air missile nuke nuclear army
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 4.86
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 500
	breakingTorque = 500
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 12.5
		bodyColor = 0.93, 0.93, 0.91      // US Army white
		shininess = 0.35
		panelLines = true
		seamSpacing = 1.2
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00    // sharp ogive nose
			point = 0.08, 0.02
			point = 0.25, 0.05
			point = 0.50, 0.09
			point = 0.80, 0.13
			point = 1.20, 0.168
			point = 1.60, 0.20
			point = 2.10, 0.23
			point = 2.60, 0.25
			point = 3.00, 0.26
			point = 3.40, 0.265
			point = 7.90, 0.265   // sustainer body, 0.53 m
			point = 8.00, 0.255
			point = 8.10, 0.24    // sustainer boattail / nozzle in the booster adapter
			point = 8.18, 0.24
			point = 8.40, 0.40    // booster adapter flares out to the 0.80 m 4-motor cluster
			point = 12.30, 0.40
			point = 12.34, 0.39
			point = 12.34, 0.39
			point = 12.34, 0.22   // booster aft closure
			point = 12.34, 0.22
			point = 12.38, 0.16
			point = 12.50, 0.28   // nozzle
			point = 12.50, 0.00
		}
		BAND    // black radome / fuze tip
		{
			from = 0.0
			to = 0.18
			color = 0.10, 0.10, 0.10
		}
		BAND    // warhead section marker
		{
			from = 2.3
			to = 2.38
			color = 0.85, 0.70, 0.10
		}
		BAND    // warhead / guidance joint
		{
			from = 3.38
			to = 3.4
			color = 0.30, 0.30, 0.30
		}
		BAND    // sustainer case joint
		{
			from = 5.0
			to = 5.02
			color = 0.30, 0.30, 0.30
		}
		BAND    // sustainer / booster joint
		{
			from = 8.05
			to = 8.4
			color = 0.20, 0.20, 0.20
		}
		BAND    // booster cluster strap
		{
			from = 10.3
			to = 10.33
			color = 0.30, 0.30, 0.30
		}
		BAND    // booster nozzle ring
		{
			from = 12.3
			to = 12.34
			color = 0.18, 0.18, 0.18
		}
		BAND    // nozzle
		{
			from = 12.34
			to = 12.5
			color = 0.09, 0.09, 0.10
		}
		FINS    // small forward control fins
		{
			count = 4
			roll = 45
			rootFront = 1.25
			rootBack = 1.95
			tipFront = 1.7
			tipBack = 1.95
			span = 0.5
			thickness = 0.03
			color = 0.90, 0.90, 0.88
		}
		FINS    // long-chord delta wings, 1.88 m span
		{
			count = 4
			roll = 45
			rootFront = 3.6
			rootBack = 7.9
			tipFront = 7.35
			tipBack = 7.9
			span = 0.94
			thickness = 0.05
			color = 0.90, 0.90, 0.88
		}
		FINS    // big booster fins, ~3.5 m span
		{
			count = 4
			roll = 45
			parent = boosterStage
			rootFront = 10.7
			rootBack = 12.32
			tipFront = 11.55
			tipBack = 12.5
			span = 1.75
			thickness = 0.06
			color = 0.90, 0.90, 0.88
		}
		FINS    // grooves between the four booster motors
		{
			count = 4
			roll = 0
			parent = boosterStage
			rootFront = 8.5
			rootBack = 12.28
			tipFront = 8.5
			tipBack = 12.28
			span = 0.405
			thickness = 0.03
			color = 0.30, 0.30, 0.30
		}
		FINS    // sustainer cable raceways, between the wings
		{
			count = 2
			roll = 0
			rootFront = 3.5
			rootBack = 7.8
			tipFront = 3.52
			tipBack = 7.78
			span = 0.285
			thickness = 0.035
			color = 0.86, 0.86, 0.84
		}
		TRANSFORM                         // sustainer nozzle (cruise exhaust)
		{
			name = exhaustTransform
			position = 0, 0, -2.0
			forward = 0, 0, -1
		}
		TRANSFORM                         // stage 1 body: dropped whole at boost burnout (boostTransformName), nozzles and fins with it
		{
			name = boosterStage
			position = 0, 0, -2.0
			forward = 0, 0, -1
			detach = 8.25, 12.5
		}
		TRANSFORM                         // booster cluster nozzles (boost exhaust; dropped at burnout)
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0, 0, -6.3
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Nike Hercules

		thrust = 978                    // kN, four M5E1 boosters
		cruiseThrust = 44.4             // kN, M30 sustainer
		dropTime = 0                    // <= 0.5 s: BDModuleNuke will not detonate in the Drop state
		boostTime = 3.4
		cruiseTime = 29
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 1.40
		cruiseFuelMass = 0.57
		decoupleBoosters = true
		boosterMass = 0.95              // booster cluster dry mass (2.345 t loaded), removed at burnout
		boosterDecoupleSpeed = 5

		decoupleSpeed = 5
		decoupleForward = true

		audioClipPath = BDArmory/Sounds/rocketLoop
		boostClipPath = BDArmory/Sounds/rocketLoop
		boostTransformName = boosterStage
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 1200

		aero = true
		liftArea = 0.035                // 0.014 per tonne of sustainer, like the AIM-120
		steerMult = 5
		maxTorque = 150
		torqueRampUp = 4
		aeroSteerDamping = 4
		maxAoA = 25
		gLimit = 15

		missileType = missile
		homingType = aam
		pronavGain = 4
		targetingType = radar           // the real missile was command-guided by the battery's ground radars
		activeRadarRange = 20000
		radarLOAL = true
		maxOffBoresight = 180           // launched near-vertical
		lockedSensorFOV = 7
		chaffEffectivity = 0.6

		// BDArmory standoff = sqrt(20) * 500 = 2236 m, and the warhead stays safe until 1.25x that (2.8 km) from the launcher.
		minStaticLaunchRange = 5000
		maxStaticLaunchRange = 140000
		maxAltitude = 60000             // non-zero so the climb to altitude is not flagged as a miss

		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false

		DetonationDistance = 400        // proximity (command) burst, a few hundred metres from the target
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 20
		thermalRadius = 1764
		fluence = 20
		isEMP = true
		reportingName = W31 Nike Hercules
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		exhaustSmoke = 0.35            // BDArmory largeExhaust smoke piles up round the pad
		style = auto                    // usually a high air burst: free fireball and smoke ring, no stem
	}
}
