// LIM-49A Spartan with the W71 warhead (~5 Mt): three-stage, silo-launched exo-atmospheric anti-ballistic
// missile of the Safeguard program (operational briefly in 1975). 16.8 m long, 1.09 m max diameter, ~13,100 kg.
// Stage 1 TX-500 with four large swept fins, stage 2 TX-454 with small fins, stage 3 TX-239 and a long conical
// nose. The W71 was designed to kill incoming reentry vehicles with its X-ray flux outside the atmosphere,
// at ranges up to ~740 km and altitudes up to ~560 km.
// Modelled as one part. BDArmory's single boost + cruise phases stand in for the three stages: boost = stage 1
// (dropped with decoupleBoosters), cruise = stages 2 and 3 combined.
// Ideal delta-v: stage 1 1.73 km/s (Isp 263 s, 17 g at launch) + stages 2/3 2.39 km/s (Isp 275 s) = 4.1 km/s,
// enough for the ~560 km intercept altitude class. Burn times follow from the propellant and a solid-motor Isp.
// Adapted from BDArmory's MIM-104 PAC-3 (bahaPac-3) and BDArmory Extended's SA-30 heavy SAM (bahaHSAM).
//
// BDArmory limitations:
//  - Launch ranges are clamped to BDArmorySettings.MAX_ENGAGEMENT_RANGE (200 km by default, set in
//    BDArmory's settings.cfg) and the weapon manager's guard range is clamped to MAX_GUARD_VISUAL_RANGE
//    (200 km). The real 740 km reach is not reachable without raising those settings.
//  - BDArmory standoff = sqrt(5000) * 500 = 35.4 km and the warhead stays in the NotSafe state until
//    1.25x that (~44 km) from the launching vessel, so the minimum launch range is 50 km.
//  - Targets must be detected (radar / data link) at those distances, and KSP only simulates vessels inside
//    the physics range (BDArmory can extend it).
// Launch it vertically: stand it on its bottom node on a pad, or radially from a vertical mount. A BDArmory
// Extended VLS cell can also hold it (MultiMissileLauncher), but the cell is far smaller than the missile.
PART:NEEDS[BDArmory]
{
	name = bdnukesSpartan
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (body radius 0.545 m at the part centre)
	node_attach = 0.0, 0.545, 0.0, 0, 1, 0, 1
	node_stack_bottom = 0.0, 0.0, -8.4, 0, 0, -1, 1

	TechRequired = experimentalScience
	entryCost = 60000
	cost = 90000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = srf
	title = LIM-49 Spartan (W71, 5 Mt)
	manufacturer = BDNukes
	description = The long-range interceptor of the US Safeguard anti-ballistic missile system, briefly operational in 1975. Three solid stages carried the 5 megaton W71 warhead hundreds of kilometres downrange to meet incoming warheads above the atmosphere, where its burst of X-rays would destroy them. In vacuum it gives an enormous flash and a glowing debris shell instead of a mushroom cloud.
	tags = spartan lim-49 lim49 w71 abm anti ballistic missile safeguard interceptor nuke nuclear megaton
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 13.1
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 1000
	breakingTorque = 1000
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 16.8
		bodyColor = 0.94, 0.94, 0.92      // white
		shininess = 0.3
		panelLines = true
		seamSpacing = 1.4
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00            // long conical nose over the W71 and stage 3
			point = 0.30, 0.05
			point = 2.00, 0.22
			point = 4.20, 0.40
			point = 5.20, 0.45
			point = 9.40, 0.45            // stage 2
			point = 9.80, 0.545           // interstage flare to stage 1
			point = 16.55, 0.545
			point = 16.80, 0.47
			point = 16.80, 0.00
		}
		BAND                              // black nose tip
		{
			from = 0.00
			to = 0.40
			color = 0.10, 0.10, 0.10
		}
		BAND                              // stage 3 / stage 2 joint
		{
			from = 5.15
			to = 5.30
			color = 0.12, 0.12, 0.12
		}
		BAND                              // stage 2 / stage 1 interstage
		{
			from = 9.40
			to = 9.80
			color = 0.12, 0.12, 0.12
		}
		BAND                              // stage 1 roll-pattern stripe
		{
			from = 12.40
			to = 12.70
			color = 0.12, 0.12, 0.12
		}
		BAND                              // aft skirt
		{
			from = 16.40
			to = 16.80
			color = 0.20, 0.20, 0.20
		}
		FINS                              // small stage 2 fins
		{
			count = 4
			roll = 45
			rootFront = 8.60
			rootBack = 9.40
			tipFront = 9.15
			tipBack = 9.40
			span = 0.80
			thickness = 0.04
			color = 0.90, 0.90, 0.88
		}
		FINS                              // large swept stage 1 fins
		{
			count = 4
			roll = 45
			parent = boosterStage
			rootFront = 14.40
			rootBack = 16.80
			tipFront = 15.90
			tipBack = 16.80
			span = 1.55
			thickness = 0.07
			color = 0.90, 0.90, 0.88
		}
		TRANSFORM                         // stage 2/3 exhaust (cruise phase)
		{
			name = exhaustTransform
			position = 0, 0, -1.2
			forward = 0, 0, -1
		}
		TRANSFORM                         // stage 1 body: dropped whole at boost burnout (boostTransformName), nozzles and fins with it
		{
			name = boosterStage
			position = 0, 0, -1.2
			forward = 0, 0, -1
			detach = 9.6, 16.8
		}
		TRANSFORM                         // stage 1 exhaust (boost phase; dropped at burnout)
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0, 0, -8.4
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Spartan

		thrust = 2200                   // kN, TX-500 first stage
		cruiseThrust = 180              // kN, stages 2 + 3 averaged
		dropTime = 0                    // <= 0.5 s: BDModuleNuke will not detonate in the Drop state
		boostTime = 7.5
		cruiseTime = 45
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 6.4
		cruiseFuelMass = 3.0
		decoupleBoosters = true
		boosterMass = 1.6               // stage 1 dry mass, removed at burnout
		boosterDecoupleSpeed = 5

		decoupleSpeed = 5
		decoupleForward = true

		audioClipPath = BDArmory/Sounds/rocketLoop
		boostClipPath = BDArmory/Sounds/launch
		boostTransformName = boosterStage
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 3000

		aero = true
		liftArea = 0.06
		steerMult = 4
		maxTorque = 600
		torqueRampUp = 4
		aeroSteerDamping = 4
		maxAoA = 20
		gLimit = 10
		vacuumSteerable = true

		missileType = missile
		homingType = pronav
		pronavGain = 4
		targetingType = radar           // Safeguard used ground radars (PAR / MSR) for command guidance
		activeRadarRange = 60000
		radarLOAL = true
		maxOffBoresight = 180           // silo / vertical launch
		lockedSensorFOV = 10

		// standoff 35.4 km; NotSafe until ~44 km from the launcher. Max clamped to MAX_ENGAGEMENT_RANGE (200 km).
		minStaticLaunchRange = 50000
		maxStaticLaunchRange = 200000
		UseStaticMaxLaunchRange = true
		maxAltitude = 1000000           // non-zero so the exo-atmospheric climb is not flagged as a miss

		engageAir = true
		engageMissile = true
		engageGround = false
		engageSLW = false

		DetonationDistance = 3000       // X-ray kill: a few km is plenty
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 5000
		thermalRadius = 11115
		fluence = 5000
		isEMP = true
		reportingName = W71 Spartan
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = highAltitude
	}
}
