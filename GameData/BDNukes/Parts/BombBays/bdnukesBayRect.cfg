// Rectangular Bomb Bay. Part of the BDNukes bomb bays (tools/make_bomb_bays.py writes this file).
// A hollow fuselage section with belly doors that works like a cargo bay: attach a weapon to an inner node or
// surface-attach it to the inside of the roof, then open the doors to drop it. ModuleBombBay builds the model and the
// door animation in code; MODEL below is only a placeholder that is stripped at load. Doors start open (like the stock
// bays) so a weapon can be placed inside; Close them in flight to shield what is inside.
PART:NEEDS[BDArmory]
{
	name = bdnukesBayRect
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	node_stack_top = 0.0, 2.040, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -2.040, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_top2 = 0.0, 2.020, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_bottom2 = 0.0, -2.020, 0.0, 0.0, 1.0, 0.0, 1

	TechRequired = advAerodynamics
	entryCost = 4608
	cost = 576
	category = Payload
	subcategory = 0
	title = Rectangular Bomb Bay
	manufacturer = BDNukes
	description = A bomb bay in the rectangular fuselage's cross-section, twice its length: room for the B61-12, B83 or Little Boy. Its doors open downwards. Weapons go inside on the inner nodes, or surface-attached to the inside of the roof.
	tags = bomb bay cargo hold payload weapon BDNukes
	attachRules = 1,0,1,1,1
	mass = 0.426
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 1
	crashTolerance = 40
	breakingForce = 100
	breakingTorque = 100
	maxTemp = 2500
	emissiveConstant = 0.8
	fuelCrossFeed = True
	bulkheadProfiles = mk1rect

	MODULE
	{
		name = ModuleBombBay
		shape = rect
		length = 4.08
		width = 1.25
		height = 1.36
		cornerRadius = 0.3
		animationName = BombBayDoors
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = BombBayDoors
		startEventGUIName = Close Bay Doors
		endEventGUIName = Open Bay Doors
		actionGUIName = Toggle Bay Doors
		allowDeployLimit = true
		revClampDirection = false
		revClampSpeed = true
		revClampPercent = true
	}
	MODULE
	{
		name = ModuleCargoBay
		DeployModuleIndex = 1
		closedPosition = 1
		lookupRadius = 2.34
		partTypeName = Bomb bay
		nodeOuterForeID = top
		nodeOuterAftID = bottom
		nodeInnerForeID = top2
		nodeInnerAftID = bottom2
	}
}
