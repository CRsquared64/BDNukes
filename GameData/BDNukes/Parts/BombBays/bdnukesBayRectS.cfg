// Rectangular Bomb Bay, Short. Part of the BDNukes bomb bays (tools/make_bomb_bays.py writes this file).
// A hollow fuselage section with belly doors that works like a cargo bay: attach a weapon to an inner node or
// surface-attach it to the inside of the roof, then open the doors to drop it. ModuleBombBay builds the model and the
// door animation in code; MODEL below is only a placeholder that is stripped at load. Doors start open (like the stock
// bays) so a weapon can be placed inside; Close them in flight to shield what is inside.
PART:NEEDS[BDArmory]
{
	name = bdnukesBayRectS
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	node_stack_top = 0.0, 1.650, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -1.650, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_top2 = 0.0, 1.630, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_bottom2 = 0.0, -1.630, 0.0, 0.0, 1.0, 0.0, 1

	TechRequired = advAerodynamics
	entryCost = 3960
	cost = 495
	category = Payload
	subcategory = 0
	title = Rectangular Bomb Bay, Short
	manufacturer = BDNukes
	description = A short bomb bay in the rectangular 2 m fuselage's cross-section, for one B57, Little Boy or Genie; it stacks with the rectangular fuselage parts. Its doors open downwards. Weapons go inside on the inner nodes, or surface-attached to the inside of the roof.
	tags = bomb bay cargo hold payload weapon BDNukes
	attachRules = 1,0,1,1,1
	mass = 0.345
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 1
	crashTolerance = 40
	breakingForce = 100
	breakingTorque = 100
	maxTemp = 2500
	emissiveConstant = 0.8
	fuelCrossFeed = True
	bulkheadProfiles = mk1rect

	MODULE
	{
		name = ModuleBombBay
		shape = rect
		length = 3.3
		width = 1.25
		height = 1.36
		cornerRadius = 0.3
		animationName = BombBayDoors
		texture = RetroFuture/StockScheme/rectFuselage_DIF
		texturePatch = 240, 160, 360, 395
		textureDensity = 180
		innerTexture = RetroFuture/StockScheme/rectFuselage_DIF
		innerPatch = 5, 5, 222, 710
		innerDensity = 200
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = BombBayDoors
		startEventGUIName = Close
		endEventGUIName = Open
		actionGUIName = Toggle Bay Doors
		allowDeployLimit = true
		revClampDirection = false
		revClampSpeed = true
		revClampPercent = true
	}
	MODULE
	{
		name = ModuleCargoBay
		DeployModuleIndex = 1
		closedPosition = 1
		lookupRadius = 1.95
		partTypeName = Bomb bay
		nodeOuterForeID = top
		nodeOuterAftID = bottom
		nodeInnerForeID = top2
		nodeInnerAftID = bottom2
	}
}
