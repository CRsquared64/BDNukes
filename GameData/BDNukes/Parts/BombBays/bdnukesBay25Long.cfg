// 2.5 m Bomb Bay, Long. Part of the BDNukes bomb bays (tools/make_bomb_bays.py writes this file).
// A hollow fuselage section with belly doors that works like a cargo bay: attach a weapon to an inner node or
// surface-attach it to the inside of the roof, then open the doors to drop it. ModuleBombBay builds the model and the
// door animation in code; MODEL below is only a placeholder that is stripped at load. Doors start open (like the stock
// bays) so a weapon can be placed inside; Close them in flight to shield what is inside.
PART:NEEDS[BDArmory]
{
	name = bdnukesBay25Long
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	node_stack_top = 0.0, 4.250, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -4.250, 0.0, 0.0, -1.0, 0.0, 2
	node_stack_top2 = 0.0, 4.230, 0.0, 0.0, -1.0, 0.0, 2
	node_stack_bottom2 = 0.0, -4.230, 0.0, 0.0, 1.0, 0.0, 2

	TechRequired = heavyAerodynamics
	entryCost = 11880
	cost = 1485
	category = Payload
	subcategory = 0
	title = 2.5 m Bomb Bay, Long
	manufacturer = BDNukes
	description = A long 2.5 m round bomb bay: long enough for the AN602 Tsar Bomba. Its doors open downwards. Weapons go inside on the inner nodes, or surface-attached to the inside of the roof.
	tags = bomb bay cargo hold payload weapon BDNukes
	attachRules = 1,0,1,1,1
	mass = 1.335
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 1
	crashTolerance = 40
	breakingForce = 100
	breakingTorque = 100
	maxTemp = 2500
	emissiveConstant = 0.8
	fuelCrossFeed = True
	bulkheadProfiles = size2

	MODULE
	{
		name = ModuleBombBay
		shape = round
		length = 8.5
		width = 2.5
		height = 2.5
		cornerRadius = 0
		animationName = BombBayDoors
		texture = Squad/Parts/FuelTank/RockomaxTanks/Assets/rockomax_16 [AlbedoM] BW
		texturePatch = 1050, 70, 830, 440
		textureDensity = 300
		innerTexture = Squad/Parts/FuelTank/RockomaxTanks/Assets/rockomax_16 [AlbedoM] BW
		innerPatch = 1050, 1480, 250, 480
		innerDensity = 300
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = BombBayDoors
		startEventGUIName = Close
		endEventGUIName = Open
		actionGUIName = Toggle Bay Doors
		allowDeployLimit = true
		revClampDirection = false
		revClampSpeed = true
		revClampPercent = true
	}
	MODULE
	{
		name = ModuleCargoBay
		DeployModuleIndex = 1
		closedPosition = 1
		lookupRadius = 4.55
		partTypeName = Bomb bay
		nodeOuterForeID = top
		nodeOuterAftID = bottom
		nodeInnerForeID = top2
		nodeInnerAftID = bottom2
	}
}
