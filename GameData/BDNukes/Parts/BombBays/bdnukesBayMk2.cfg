// Mk2 Bomb Bay. Part of the BDNukes bomb bays (tools/make_bomb_bays.py writes this file).
// A hollow fuselage section with belly doors that works like a cargo bay: attach a weapon to an inner node or
// surface-attach it to the inside of the roof, then open the doors to drop it. ModuleBombBay builds the model and the
// door animation in code; MODEL below is only a placeholder that is stripped at load. Doors start open (like the stock
// bays) so a weapon can be placed inside; Close them in flight to shield what is inside.
PART:NEEDS[BDArmory]
{
	name = bdnukesBayMk2
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	node_stack_top = 0.0, 2.000, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -2.000, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_top2 = 0.0, 1.980, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_bottom2 = 0.0, -1.980, 0.0, 0.0, 1.0, 0.0, 1

	TechRequired = highAltitudeFlight
	entryCost = 6128
	cost = 766
	category = Payload
	subcategory = 0
	title = Mk2 Bomb Bay
	manufacturer = BDNukes
	description = A wide, low bomb bay in the Mk2 fuselage's cross-section, for the B57, B61-12, B83 and Little Boy. Its doors open downwards. Weapons go inside on the inner nodes, or surface-attached to the inside of the roof.
	tags = bomb bay cargo hold payload weapon BDNukes
	attachRules = 1,0,1,1,1
	mass = 0.616
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 1
	crashTolerance = 40
	breakingForce = 100
	breakingTorque = 100
	maxTemp = 2500
	emissiveConstant = 0.8
	fuelCrossFeed = True
	bulkheadProfiles = mk2

	MODULE
	{
		name = ModuleBombBay
		shape = rect
		length = 4.0
		width = 2.5
		height = 1.35
		cornerRadius = 0.5
		animationName = BombBayDoors
		texture = Squad/Parts/FuelTank/mk2FuselageLong/mk2Fuselage
		texturePatch = 300, 380, 135, 600
		textureDensity = 165
		innerTexture = Squad/Parts/Utility/mk2CargoBay/mk2CargoBay
		innerPatch = 305, 235, 280, 780
		innerDensity = 160
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = BombBayDoors
		startEventGUIName = Close
		endEventGUIName = Open
		actionGUIName = Toggle Bay Doors
		allowDeployLimit = true
		revClampDirection = false
		revClampSpeed = true
		revClampPercent = true
	}
	MODULE
	{
		name = ModuleCargoBay
		DeployModuleIndex = 1
		closedPosition = 1
		lookupRadius = 2.30
		partTypeName = Bomb bay
		nodeOuterForeID = top
		nodeOuterAftID = bottom
		nodeInnerForeID = top2
		nodeInnerAftID = bottom2
	}
}
