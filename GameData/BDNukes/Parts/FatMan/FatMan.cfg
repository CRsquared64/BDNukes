// Fat Man (Mk 3): plutonium implosion bomb, dropped on Nagasaki on 9 Aug 1945 from the B-29 "Bockscar".
// 21 kt, 3.25 m long, 1.52 m diameter, 4,656 kg. Barometric/radar airburst at ~503 m.
// Bulbous ellipsoidal case of two bolted half-shells, sealed with black liquid asphalt along the seams,
// and the square "California parachute" box tail. Model is generated by ModuleProceduralModel;
// MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesFatMan
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (the single suspension lug sat over the widest section)
	node_attach = 0.0, 0.76, 0.45, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 20000
	cost = 20000
	category = none
	bdacategory = Bombs
	subcategory = 0
	bulkheadProfiles = srf
	title = Mk 3 "Fat Man" Bomb (21 kt)
	manufacturer = BDNukes
	description = The plutonium implosion bomb dropped on Nagasaki on 9 August 1945, airbursting at about 500 m with a yield of 21 kilotons. Its egg-shaped 1.52 m case held a sphere of high explosive lenses around a 6.2 kg plutonium core, and the square box tail kept the 4.7 tonne weapon stable in the fall. Unguided: release it straight and level over the target and leave quickly.
	tags = fat man fatman mk3 mk 3 nagasaki implosion plutonium nuke nuclear atomic bomb ww2 wwii
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 4.656
	dragModelType = default
	maximum_drag = 0.1
	minimum_drag = 0.1
	angularDrag = 2
	crashTolerance = 15
	breakingForce = 500
	breakingTorque = 500
	maxTemp = 2000
	CoMOffset = 0, 0, 0.45            // CoG at the widest section, under the suspension lug

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 3.25
		bodyColor = 0.74, 0.64, 0.24      // wartime mustard / olive-yellow
		shininess = 0.15
		panelLines = true
		seamSpacing = 0                   // the real seams are painted as tarred BANDs below
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00    // bulbous ellipsoid nose and body, widest at ~1.1 m
			point = 0.01, 0.11
			point = 0.04, 0.22
			point = 0.08, 0.31
			point = 0.12, 0.38
			point = 0.18, 0.455
			point = 0.25, 0.52
			point = 0.33, 0.58
			point = 0.42, 0.63
			point = 0.52, 0.675
			point = 0.62, 0.71
			point = 0.73, 0.735
			point = 0.85, 0.75
			point = 0.97, 0.758
			point = 1.10, 0.76
			point = 1.35, 0.76
			point = 1.48, 0.753
			point = 1.60, 0.74
			point = 1.72, 0.718
			point = 1.82, 0.69
			point = 1.92, 0.655   // short ogive into the tail cone
			point = 2.00, 0.61
			point = 2.08, 0.562
			point = 2.15, 0.51
			point = 2.23, 0.45
			point = 2.30, 0.39
			point = 2.38, 0.34
			point = 2.45, 0.30
			point = 2.52, 0.272
			point = 2.60, 0.25
			point = 2.70, 0.233
			point = 2.80, 0.22
			point = 3.22, 0.20
			point = 3.22, 0.20
			point = 3.22, 0.14    // tail cone end plate
			point = 3.22, 0.14
			point = 3.25, 0.13
			point = 3.25, 0.00
		}
		BAND    // tarred seam around the nose cap (contact fuze mounting plate)
		{
			from = 0.17
			to = 0.21
			color = 0.05, 0.05, 0.04
		}
		BAND    // tarred seam: front armour plate
		{
			from = 0.55
			to = 0.57
			color = 0.05, 0.05, 0.04
		}
		BAND    // main equatorial seam where the two ellipsoid halves bolt together
		{
			from = 1.1
			to = 1.18
			color = 0.05, 0.05, 0.04
		}
		BAND    // tarred seam: aft armour plate
		{
			from = 1.55
			to = 1.57
			color = 0.05, 0.05, 0.04
		}
		BAND    // aft half-shell to tail cone joint
		{
			from = 1.96
			to = 2.02
			color = 0.05, 0.05, 0.04
		}
		BAND    // tail cone to fin assembly joint
		{
			from = 2.56
			to = 2.6
			color = 0.05, 0.05, 0.04
		}
		FINS    // box tail: four diagonal fins whose tips meet the corners of a square shroud ~1.4 m across
		{
			count = 4
			roll = 45
			rootFront = 2.58
			rootBack = 3.25
			tipFront = 2.66
			tipBack = 3.25
			span = 0.99
			thickness = 0.02
			color = 0.66, 0.57, 0.21
			shroud = box
			shroudChord = 0.59
		}
		FINS    // box tail struts from the tail cone to the middle of each shroud side
		{
			count = 4
			roll = 0
			rootFront = 2.78
			rootBack = 3.02
			tipFront = 2.8
			tipBack = 3.0
			span = 0.7
			thickness = 0.015
			color = 0.60, 0.52, 0.19
		}
		FINS    // four AN 219 contact fuzes on the nose
		{
			count = 4
			roll = 0
			rootFront = 0.19
			rootBack = 0.29
			tipFront = 0.21
			tipBack = 0.27
			span = 0.6
			thickness = 0.06
			color = 0.20, 0.20, 0.18
		}
		FINS    // suspension lug
		{
			count = 1
			roll = 90
			rootFront = 1.18
			rootBack = 1.28
			tipFront = 1.2
			tipBack = 1.26
			span = 0.79
			thickness = 0.05
			color = 0.20, 0.20, 0.18
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Fat Man

		// unguided free-fall bomb, after BDArmory's mk82Bomb
		thrust = 0
		cruiseThrust = 0
		dropTime = 0.3                    // BDModuleNuke refuses to detonate during Drop: keep short
		guidanceActive = false
		decoupleSpeed = 2

		useSimpleDrag = true
		simpleCoD = 0, 0, -1.4            // drag acts at the box tail, keeping the nose down
		simpleStableTorque = 5
		rndAngVel = 0.5
		liftArea = 0

		missileType = bomb
		homingType = none
		targetingType = none

		minStaticLaunchRange = 3000       // BDArmory blast standoff for 21 kt is sqrt(21)*500 = 2.3 km (x1.25 = 2.9 km)
		maxStaticLaunchRange = 12000

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 21               // kilotons
		thermalRadius = 1793     // round(650 * 21^(1/3))
		fluence = 21
		isEMP = true
		reportingName = Mk 3 Fat Man
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 10
		detonateOnDestroyed = true
		airburstAltitude = 500       // Nagasaki burst height ~503 m
		maxAirburstAltitude = 3000
		maxProximityRange = 3000
		armingDelay = 3
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
