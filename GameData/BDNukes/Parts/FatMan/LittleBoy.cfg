// Little Boy (Mk 1): uranium gun-type bomb, dropped on Hiroshima on 6 Aug 1945 from the B-29 "Enola Gay".
// ~15 kt, 3.0 m long, 0.71 m diameter, ~4,400 kg. Radar (Archie) fuzed airburst at ~580 m.
// Long cylindrical case, rounded nose, square box-shrouded tail. Model is generated by ModuleProceduralModel;
// MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesLittleBoy
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.355, 0.2, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 18000
	cost = 18000
	category = none
	bdacategory = Bombs
	subcategory = 0
	bulkheadProfiles = srf
	title = Mk 1 "Little Boy" Bomb (15 kt)
	manufacturer = BDNukes
	description = The uranium gun-type bomb dropped on Hiroshima on 6 August 1945, airbursting at about 580 m with a yield of roughly 15 kilotons. A cordite charge fired one mass of enriched uranium down a smoothbore gun barrel into another, a design so certain to work that it was never tested beforehand. Unguided: release it straight and level and turn away hard.
	tags = little boy littleboy mk1 mk 1 hiroshima gun type uranium nuke nuclear atomic bomb ww2 wwii
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 4.4
	dragModelType = default
	maximum_drag = 0.05
	minimum_drag = 0.05
	angularDrag = 2
	crashTolerance = 15
	breakingForce = 500
	breakingTorque = 500
	maxTemp = 2000
	CoMOffset = 0, 0, 0.2             // heavy uranium target assembly in the nose: CoG forward, under the lug

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 3.0
		bodyColor = 0.33, 0.35, 0.24      // olive drab
		shininess = 0.2
		panelLines = true
		seamSpacing = 0
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00    // blunt rounded nose (the uranium target assembly sits right behind it)
			point = 0.01, 0.09
			point = 0.03, 0.15
			point = 0.06, 0.205
			point = 0.09, 0.24
			point = 0.13, 0.278
			point = 0.18, 0.31
			point = 0.24, 0.333
			point = 0.30, 0.345
			point = 0.42, 0.355   // nose cap joint ridge
			point = 0.42, 0.355
			point = 0.42, 0.36
			point = 0.42, 0.36
			point = 0.45, 0.36
			point = 0.45, 0.36
			point = 0.45, 0.355
			point = 0.45, 0.355
			point = 1.20, 0.355   // long gun-barrel cylinder
			point = 1.20, 0.355
			point = 1.20, 0.36
			point = 1.20, 0.36
			point = 1.23, 0.36
			point = 1.23, 0.36
			point = 1.23, 0.355
			point = 1.23, 0.355
			point = 2.03, 0.355
			point = 2.03, 0.355
			point = 2.03, 0.36
			point = 2.03, 0.36
			point = 2.06, 0.36
			point = 2.06, 0.36
			point = 2.06, 0.355
			point = 2.06, 0.355
			point = 2.12, 0.352
			point = 2.20, 0.345   // short tapered tail cone inside the box tail
			point = 2.28, 0.33
			point = 2.35, 0.31
			point = 2.43, 0.283
			point = 2.50, 0.25
			point = 2.58, 0.228
			point = 2.65, 0.21
			point = 2.97, 0.19
			point = 2.97, 0.19
			point = 2.97, 0.13
			point = 2.97, 0.13
			point = 3.00, 0.12
			point = 3.00, 0.00
		}
		BAND    // nose cap joint
		{
			from = 0.42
			to = 0.45
			color = 0.08, 0.08, 0.07
		}
		BAND    // centre section joint
		{
			from = 1.2
			to = 1.23
			color = 0.08, 0.08, 0.07
		}
		BAND    // tail section joint
		{
			from = 2.03
			to = 2.06
			color = 0.08, 0.08, 0.07
		}
		BAND    // tail plate
		{
			from = 2.97
			to = 3.0
			color = 0.20, 0.21, 0.15
		}
		FINS    // box tail: four fins inside a square shroud about as wide as the body
		{
			count = 4
			roll = 45
			rootFront = 2.3
			rootBack = 3.0
			tipFront = 2.5
			tipBack = 3.0
			span = 0.52
			thickness = 0.015
			color = 0.29, 0.31, 0.21
			shroud = box
			shroudChord = 0.45
		}
		FINS    // box tail struts to the middle of each shroud side
		{
			count = 4
			roll = 0
			rootFront = 2.62
			rootBack = 2.86
			tipFront = 2.64
			tipBack = 2.84
			span = 0.37
			thickness = 0.012
			color = 0.27, 0.29, 0.20
		}
		FINS    // Archie radar fuze antennas on the tail cone
		{
			count = 2
			roll = 0
			rootFront = 2.1
			rootBack = 2.15
			tipFront = 2.2
			tipBack = 2.22
			span = 0.52
			thickness = 0.012
			color = 0.15, 0.15, 0.13
		}
		FINS    // single suspension lug
		{
			count = 1
			roll = 90
			rootFront = 1.24
			rootBack = 1.36
			tipFront = 1.27
			tipBack = 1.33
			span = 0.39
			thickness = 0.04
			color = 0.15, 0.15, 0.13
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Little Boy

		// unguided free-fall bomb, after BDArmory's mk82Bomb
		thrust = 0
		cruiseThrust = 0
		dropTime = 0.3                    // BDModuleNuke refuses to detonate during Drop: keep short
		guidanceActive = false
		decoupleSpeed = 2

		useSimpleDrag = true
		simpleCoD = 0, 0, -1.3
		simpleStableTorque = 5
		rndAngVel = 0.5
		liftArea = 0

		missileType = bomb
		homingType = none
		targetingType = none

		minStaticLaunchRange = 2500       // BDArmory blast standoff for 15 kt is sqrt(15)*500 = 1.9 km (x1.25 = 2.4 km)
		maxStaticLaunchRange = 12000

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 15               // kilotons
		thermalRadius = 1603     // round(650 * 15^(1/3))
		fluence = 15
		isEMP = true
		reportingName = Mk 1 Little Boy
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 10
		detonateOnDestroyed = true
		airburstAltitude = 580       // Hiroshima burst height
		maxAirburstAltitude = 3000
		maxProximityRange = 3000
		armingDelay = 3
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
