// M29 155 mm recoilless rifle, the heavy launcher of the Davy Crockett weapon system (US Army, 1961-1971),
// firing the M388 round with the W54 warhead (10-20 t; 20 t used). ~2.6 m tube with a breech venturi on a
// low tripod, ~180 kg with the mount. Range ~2-4 km.
// Adapted from BDArmory Extended's 105 mm recoilless rifle (baha105mmRCL) and BDArmory's M102 howitzer.
// The projectile is the BULLET BDNukes_M388 in GameData/BDNukes/BulletDefs/BDNukes_Bullets.cfg; ammo is the
// M388Round resource in BDNukes_Ammo.cfg.
//
// Notes:
//  - A fixed gun (no ModuleTurret): ModuleProceduralModel builds one static mesh and its TRANSFORM nodes are
//    not parented, so there is no pitch/yaw transform for a turret to move the barrel with. Aim by pointing the
//    vehicle, and tilt the part up in the editor for indirect (lobbed) fire: at 180 m/s the round drops ~150 m
//    over 1 km if fired flat.
//  - minSafeDistance keeps the AI from firing inside ~500 m of its own crew.
//  - No BDModuleNuke / ModuleNukeCloudProfile here: the explosion comes from the shell (BULLET nuclear = True),
//    which BDArmory creates without a part, so a part-based cloud profile would never be read.
PART:NEEDS[BDArmory]
{
	name = bdnukesM29DavyCrockett
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// Barrel along +Z (muzzle forward); attaches by the tripod feet on its -Y side
	node_attach = 0.0, -0.75, 0.0, 0, -1, 0, 0

	TechRequired = precisionEngineering
	entryCost = 12000
	cost = 8000
	category = none
	bdacategory = Guns
	subcategory = 0
	bulkheadProfiles = srf
	title = M29 Davy Crockett (W54, 20 t)
	manufacturer = BDNukes
	description = The smallest nuclear weapon system the United States ever fielded: a 155 mm recoilless rifle on a tripod that lobs the M388 round, a 34.5 kg finned teardrop carrying the W54 warhead of 10 to 20 tons. Issued to Army infantry and airborne units in Europe in the 1960s, it had a range of only a few kilometres. Its burst is a small, fat, dusty cloud rather than a towering mushroom.
	tags = davy crockett m29 m388 w54 recoilless rifle gun nuke nuclear atomic infantry army
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 0.18
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 60
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 3600

	stagingIcon = SOLID_BOOSTER

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 2.6
		bodyColor = 0.33, 0.36, 0.24      // US Army olive drab
		shininess = 0.15
		panelLines = false
		seamSpacing = 0
		collider = box
		PROFILE
		{
			point = 0.00, 0.00            // muzzle face
			point = 0.00, 0.105
			point = 0.10, 0.105           // muzzle ring
			point = 0.12, 0.09
			point = 1.75, 0.09            // 155 mm tube
			point = 1.80, 0.125           // breech / chamber
			point = 2.10, 0.135
			point = 2.16, 0.10            // venturi throat
			point = 2.60, 0.17            // recoilless venturi flare
			point = 2.60, 0.00
		}
		BAND                              // venturi, darker metal
		{
			from = 2.16
			to = 2.60
			color = 0.20, 0.21, 0.18
		}
		BAND                              // muzzle ring
		{
			from = 0.00
			to = 0.10
			color = 0.22, 0.23, 0.19
		}
		FINS                              // left front tripod leg
		{
			count = 1
			roll = 235
			rootFront = 0.95
			rootBack = 1.10
			tipFront = 0.55
			tipBack = 0.63
			span = 0.75
			thickness = 0.035
			color = 0.27, 0.29, 0.20
		}
		FINS                              // right front tripod leg
		{
			count = 1
			roll = 305
			rootFront = 0.95
			rootBack = 1.10
			tipFront = 0.55
			tipBack = 0.63
			span = 0.75
			thickness = 0.035
			color = 0.27, 0.29, 0.20
		}
		FINS                              // rear tripod leg
		{
			count = 1
			roll = 270
			rootFront = 1.45
			rootBack = 1.60
			tipFront = 2.15
			tipBack = 2.23
			span = 0.75
			thickness = 0.035
			color = 0.27, 0.29, 0.20
		}
		TRANSFORM                         // ModuleWeapon fireTransformName: at the muzzle, facing out
		{
			name = fireTransform
			position = 0, 0, 1.3
			forward = 0, 0, 1
		}
	}

	MODULE
	{
		name = ModuleWeapon
		shortName = M29 Davy Crockett

		fireTransformName = fireTransform

		hasDeployAnim = false
		hasFireAnimation = false

		roundsPerMinute = 1             // one round a minute: the crew reloads the spigot round by hand
		maxDeviation = 0.5
		maxEffectiveDistance = 3000
		maxTargetingRange = 3500
		minSafeDistance = 500
		ammoName = M388Round
		bulletType = BDNukes_M388
		requestResourceAmount = 1

		hasRecoil = true
		recoilReduction = 0.1           // recoilless
		onlyFireInRange = true
		bulletDrop = true

		weaponType = ballistic
		oneShotWorldParticles = true
		tracerLength = 0
		tracerDeltaFactor = 3.75
		tracerLuminance = 2

		maxHeat = 3600
		heatPerShot = 60
		heatLoss = 740

		fireSoundPath = BDArmoryExtended/Parts/100mmTurret/4inFire
		reloadAudioPath = BDArmory/Parts/m1Abrams/sounds/reload
		overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat
		oneShotSound = true
		showReloadMeter = true
	}

	RESOURCE
	{
		name = M388Round
		amount = 3
		maxAmount = 3
	}
}
