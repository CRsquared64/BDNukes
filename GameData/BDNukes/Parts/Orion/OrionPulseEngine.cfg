// Project Orion nuclear pulse propulsion unit (General Atomics, 1958-1965), after the "10-meter" Orion:
// a 4,000 t ship pushed by ~0.15 kt pulse units thrown out behind a 10 m pusher plate about once a second.
// Scaled for KSP: 10 m plate, 0.2 t pulse units (BDNukesPulseUnit, GameData/BDNukes/Resources), one pulse
// every 0.8 s at full throttle, 6,000 kN*s per pulse (7,500 kN average, ~3,060 s effective Isp).
// Model is generated by ModuleProceduralModel (axis Y: magazine on top, shock absorbers, pusher plate at the
// bottom); MODEL below is only a placeholder that is stripped at load.
//
// Stage it (or use the Activate button / action group) and throttle up: the throttle sets the pulse rate.
// ModuleOrionPulseEngine is not a stock engine, so the stock delta-v readout and engine-based autopilots
// don't see it. No BDArmory nuke is involved: the pulse units only make a flash and push the plate.
PART:NEEDS[BDArmory]
{
	name = bdnukesOrionPulseEngine
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// Ship stacks on top; the plate face (bottom, -Y) has no node
	node_stack_top = 0.0, 6.0, 0.0, 0, 1, 0, 4

	TechRequired = nuclearPropulsion
	entryCost = 400000
	cost = 250000
	category = Engine
	subcategory = 0
	bulkheadProfiles = size4
	title = Orion Nuclear Pulse Drive (10 m)
	manufacturer = BDNukes
	description = Project Orion's answer to getting big ships around the solar system: throw a small nuclear bomb out the back, set it off, and ride the blast on a ten-metre steel pusher plate with giant shock absorbers to smooth the kick. The magazine holds 600 pulse units. Throttle sets the pulse rate. Each pulse is a sharp kick rather than steady thrust, so build sturdy and fly with SAS.
	tags = orion nuclear pulse propulsion pusher plate engine bomb drive nuke nuclear interplanetary
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,0,1,0,0

	mass = 90
	dragModelType = default
	maximum_drag = 0.3
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 20
	breakingForce = 5000
	breakingTorque = 5000
	maxTemp = 4000
	skinMaxTemp = 4500

	stagingIcon = LIQUID_ENGINE

	MODULE
	{
		name = ModuleProceduralModel
		axis = Y
		length = 12
		bodyColor = 0.74, 0.75, 0.74      // light grey magazine
		shininess = 0.3
		panelLines = true
		seamSpacing = 1.0
		collider = box
		segments = 64
		PROFILE
		{
			point = 0.00, 0.00    // top deck (stack node)
			point = 0.00, 2.8
			point = 0.00, 2.8
			point = 0.05, 3.1
			point = 0.15, 3.3
			point = 0.30, 3.4
			point = 0.45, 3.47
			point = 0.60, 3.5
			point = 0.60, 3.5
			point = 5.60, 3.5     // pulse unit magazine
			point = 5.60, 3.5
			point = 5.80, 3.3
			point = 6.00, 3.0
			point = 6.20, 2.0     // neck to the delivery system
			point = 6.20, 2.0
			point = 6.40, 2.0
			point = 6.40, 2.0
			point = 6.40, 2.4     // upper absorber collar
			point = 6.40, 2.4
			point = 6.48, 2.45
			point = 6.48, 2.45
			point = 6.92, 2.45
			point = 6.92, 2.45
			point = 7.00, 2.4
			point = 7.00, 2.4
			point = 7.00, 1.6     // shock absorber column
			point = 7.00, 1.6
			point = 8.80, 1.6
			point = 8.80, 1.6
			point = 8.80, 1.68    // mid-column clamp ring
			point = 8.80, 1.68
			point = 8.95, 1.68
			point = 8.95, 1.68
			point = 8.95, 1.6
			point = 8.95, 1.6
			point = 10.60, 1.6
			point = 10.60, 1.6
			point = 10.60, 2.2    // lower absorber collar
			point = 10.60, 2.2
			point = 11.00, 2.2
			point = 11.00, 2.2
			point = 11.20, 1.2
			point = 11.20, 1.2
			point = 11.25, 5.0    // pusher plate back face
			point = 11.25, 5.0
			point = 11.75, 5.0    // plate rim
			point = 11.75, 5.0
			point = 11.88, 4.85
			point = 12.00, 4.6
			point = 12.00, 4.6
			point = 12.00, 0.00   // plate face
		}
		BAND    // top deck ring
		{
			from = 0.0
			to = 0.6
			color = 0.55, 0.56, 0.57
		}
		BAND    // magazine panel seam
		{
			from = 1.2
			to = 1.25
			color = 0.40, 0.41, 0.42
		}
		BAND    // magazine hatch band
		{
			from = 2.4
			to = 2.6
			color = 0.30, 0.31, 0.32
		}
		BAND    // magazine panel seam
		{
			from = 3.3
			to = 3.35
			color = 0.40, 0.41, 0.42
		}
		BAND    // magazine hatch band
		{
			from = 4.2
			to = 4.4
			color = 0.30, 0.31, 0.32
		}
		BAND    // magazine panel seam
		{
			from = 5.0
			to = 5.05
			color = 0.40, 0.41, 0.42
		}
		BAND    // neck and absorber section, bare steel
		{
			from = 5.6
			to = 11.2
			color = 0.42, 0.43, 0.44
		}
		BAND    // clamp ring
		{
			from = 8.8
			to = 8.95
			color = 0.30, 0.31, 0.33
		}
		BAND    // pusher plate, scorched steel
		{
			from = 11.2
			to = 12.0
			color = 0.22, 0.21, 0.20
		}
		BAND    // ablation-oiled plate edge
		{
			from = 11.85
			to = 12.0
			color = 0.15, 0.14, 0.13
		}
		FINS    // long-stroke shock absorber struts, column to plate rim
		{
			count = 8
			roll = 0
			rootFront = 7.0
			rootBack = 7.4
			tipFront = 10.9
			tipBack = 11.22
			span = 4.3
			thickness = 0.3
			color = 0.30, 0.31, 0.33
		}
		FINS    // upper absorber links, magazine to column
		{
			count = 8
			roll = 22.5
			rootFront = 7.1
			rootBack = 7.6
			tipFront = 5.9
			tipBack = 6.1
			span = 3.1
			thickness = 0.2
			color = 0.30, 0.31, 0.33
		}
		FINS    // magazine stringers
		{
			count = 16
			roll = 11.25
			rootFront = 0.65
			rootBack = 5.55
			tipFront = 0.65
			tipBack = 5.55
			span = 3.56
			thickness = 0.08
			color = 0.60, 0.61, 0.60
		}
		TRANSFORM                         // plate face; forward points out behind the ship
		{
			name = pusherPlate
			position = 0, -6.0, 0
			forward = 0, -1, 0
		}
	}

	MODULE
	{
		name = ModuleOrionPulseEngine
		pulseImpulse = 6000               // kN*s per pulse
		pulseInterval = 0.8               // s between pulses at full throttle
		minThrottle = 0.02
		resourceName = BDNukesPulseUnit
		unitsPerPulse = 1
		strokeTime = 0.4                  // s: shock absorbers spread each kick over this long (peak ~2x average)
		plateShare = 0.3                  // share of the kick on this part; the rest is spread over the ship by mass
		plateTransformName = pusherPlate
		pulseDistance = 25                // m behind the plate
		flashRadius = 14
		flashTime = 0.3
		soundPath = BDArmory/Sounds/explode1
		soundVolume = 0.45
	}

	RESOURCE
	{
		name = BDNukesPulseUnit
		amount = 600
		maxAmount = 600
	}
}
