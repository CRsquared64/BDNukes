// B61 Mod 12: US variable-yield thermonuclear gravity bomb with a Boeing guided tail kit (in service from 2022).
// Dial-a-yield 0.3 / 1.5 / 10 / 50 kt. ~3.6 m long, 0.33 m diameter, ~375 kg.
// Slim cylindrical case, rounded ogive nose, slight boat-tail and four small steerable tail fins.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesB61Mod12
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side (14 in lug spacing, centred near the CoG)
	node_attach = 0.0, 0.165, 0.1, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 30000
	cost = 30000
	category = none
	bdacategory = Bombs
	subcategory = 0
	bulkheadProfiles = srf
	title = B61-12 Guided Nuclear Bomb (0.3-50 kt)
	manufacturer = BDNukes
	description = The newest version of the B61, the most numerous US nuclear bomb, consolidating older mods into one weapon with a GPS/inertial guided tail kit. Its yield can be set before release to 0.3, 1.5, 10 or 50 kilotons, and the tail kit's accuracy lets a lower setting hold targets that once needed a much larger bomb. Glides to a GPS target like a JDAM; set the yield and airburst height in the right-click menu.
	tags = b61 b61-12 b6112 mod 12 dial a yield variable yield guided gps jdam nuke nuclear thermonuclear bomb
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 0.375
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 10
	maxTemp = 3000

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 3.6
		bodyColor = 0.86, 0.87, 0.86      // white / very light grey case
		shininess = 0.4
		panelLines = true
		seamSpacing = 0.9
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00
			point = 0.03, 0.06
			point = 0.09, 0.105
			point = 0.18, 0.135
			point = 0.30, 0.155
			point = 0.45, 0.164
			point = 0.60, 0.165
			point = 2.95, 0.165
			point = 3.10, 0.160
			point = 3.30, 0.148
			point = 3.50, 0.135
			point = 3.58, 0.125
			point = 3.60, 0.00
		}
		BAND    // nose cap
		{
			from = 0.00
			to = 0.30
			color = 0.62, 0.63, 0.64
		}
		BAND    // tail kit section (bare grey anodised)
		{
			from = 2.95
			to = 3.60
			color = 0.52, 0.53, 0.55
		}
		BAND    // tail kit joint
		{
			from = 2.93
			to = 2.96
			color = 0.12, 0.12, 0.13
		}
		FINS    // tail kit: four small steerable fins
		{
			count = 4
			roll = 45
			rootFront = 3.08
			rootBack = 3.56
			tipFront = 3.34
			tipBack = 3.56
			span = 0.31
			thickness = 0.012
			color = 0.50, 0.51, 0.53
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = B61-12

		// GPS-guided gravity bomb, after BDArmory's jdamMk83
		thrust = 0
		cruiseThrust = 0
		dropTime = 0.5                    // jdam uses 1 s; BDModuleNuke refuses to detonate during Drop
		boostTime = 0
		cruiseTime = 80
		guidanceActive = true
		maxTurnRateDPS = 20

		missileType = bomb
		DetonationDistance = 0
		targetingType = gps
		gpsUpdates = 0.5
		homingType = AGMBallistic
		optimumAirspeed = 300

		aero = true
		liftArea = 0.0035
		steerMult = 4
		maxTorque = 6

		decoupleSpeed = 2

		minStaticLaunchRange = 3600       // BDArmory blast standoff at the 50 kt setting is ~3.5 km
		maxStaticLaunchRange = 20000

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 50               // kilotons; overwritten by ModuleNukeYieldSelector
		thermalRadius = 2395     // round(650 * 50^(1/3))
		fluence = 50
		isEMP = true
		reportingName = B61-12
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeYieldSelector
		yields = 0.3, 1.5, 10, 50
		defaultIndex = 3
		thermalRadiusAtMax = 2395
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 10
		detonateOnDestroyed = true
		airburstAltitude = 300       // set 0 for a surface burst
		maxAirburstAltitude = 3000
		maxProximityRange = 3000
		armingDelay = 3
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
