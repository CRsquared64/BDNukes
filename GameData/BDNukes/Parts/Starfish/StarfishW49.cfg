// "Starfish Prime" test package: a W49 thermonuclear warhead (1.4 Mt) in a Mk 2 reentry vehicle, launched on a Thor
// from Johnston Island on 9 July 1962 (Operation Fishbowl) and fired at 400 km. The flash was seen from Hawaii,
// 1,450 km away; the EMP knocked out street lights and telephone links there; aurorae spread along the field
// lines; and the artificial radiation belt it left killed at least six satellites, among them Telstar 1.
// A stack part for your own rocket: it has no motor. Put a decoupler under it, loft it above 400 km and arm it.
// The altitude fuze fires on the way down past the set altitude (it can be set from 1 to 1,000 km), so the
// trajectory must peak above it. Or fire it with the Detonate action group at the top of the climb.
// Bursts above the atmosphere get the vacuum effects (X-ray flash, debris shell, aurora), and with BDNukes'
// radiation belts on, the burst injects a belt (see the radiationBelts settings).
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesStarfishW49
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// Vertical stack part: nose along +Y, centred, so the base is at -1.0
	node_stack_bottom = 0.0, -1.0, 0.0, 0, -1, 0, 1
	node_attach = 0.0, -1.0, 0.0, 0, -1, 0, 1

	TechRequired = experimentalScience
	entryCost = 50000
	cost = 80000
	category = none
	bdacategory = Warheads
	subcategory = 0
	bulkheadProfiles = size1, srf
	title = Starfish Prime Test Package (W49, 1.4 Mt)
	manufacturer = BDNukes
	description = The warhead from the most famous high-altitude nuclear test. Lift it above 400 km on any rocket and let it fire on the way down: the sky lights up across half the planet, aurorae run along the magnetic field, and the radiation belt it leaves behind slowly kills satellites for weeks. Set the burst altitude in the right-click menu.
	tags = starfish prime fishbowl w49 thor high altitude test exoatmospheric space emp radiation belt warhead mk2 rv nuke nuclear thermonuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,0,0

	mass = 0.9
	dragModelType = default
	maximum_drag = 0.05
	minimum_drag = 0.05
	angularDrag = 1
	crashTolerance = 20
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 2400
	skinMaxTemp = 3000

	MODULE
	{
		name = ModuleProceduralModel
		axis = Y
		length = 2.0
		bodyColor = 0.86, 0.84, 0.78      // white-painted heat sink RV
		shininess = 0.25
		panelLines = true
		seamSpacing = 0.5
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00            // blunt Mk 2 heat-sink nose
			point = 0.03, 0.12
			point = 0.10, 0.22
			point = 0.25, 0.30
			point = 1.70, 0.44
			point = 1.85, 0.46
			point = 2.00, 0.42
			point = 2.00, 0.00
		}
		BAND    // copper heat-sink nose
		{
			from = 0.00
			to = 0.20
			color = 0.55, 0.32, 0.18
		}
		BAND    // instrument ring
		{
			from = 1.20
			to = 1.28
			color = 0.15, 0.15, 0.15
		}
		BAND    // base
		{
			from = 1.80
			to = 2.00
			color = 0.30, 0.30, 0.30
		}
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 1400
		thermalRadius = 7272     // round(650 * 1400^(1/3))
		fluence = 1400
		isEMP = true
		reportingName = Starfish W49
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 50
		detonateOnDestroyed = true
		airburstAltitude = 400000        // m: Starfish Prime's height of burst
		maxAirburstAltitude = 1000000
		maxProximityRange = 3000
		armingDelay = 60                 // safe on the pad and through the climb
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
