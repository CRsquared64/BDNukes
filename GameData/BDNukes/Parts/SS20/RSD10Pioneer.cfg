// RSD-10 Pioneer (NATO SS-20 "Saber"), Mod 2: two-stage solid-fuel road-mobile intermediate-range ballistic missile,
// Soviet service 1976-1988, launched from the MAZ-547 six-axle transporter-erector-launcher; removed under the INF
// Treaty. 16.5 m long (in its launch canister ~19 m), 1.79 m diameter, ~37,000 kg, range ~5,000 km.
// Mod 2 carried three 150 kt MIRVs. Its deployment over Europe led directly to the Pershing II.
// Modelled as one part: boost = stage 1 (dropped with decoupleBoosters), cruise = stage 2. ModuleMIRVBus spreads the
// three warheads. Ideal delta-v ~2.5 km/s (stage 1, Isp 260 s) + ~3.1 km/s (stage 2, Isp 265 s).
// BDArmory limits: launch range clamped to MAX_ENGAGEMENT_RANGE (200 km by default); standoff
// sqrt(150) * 500 = 6.1 km plus the 3 km MIRV footprint. Launch it vertically, standing on its bottom node.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesRSD10Pioneer
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.895, 0.0, 0, 1, 0, 2
	node_stack_bottom = 0.0, 0.0, -8.25, 0, 0, -1, 2

	TechRequired = experimentalScience
	entryCost = 90000
	cost = 180000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = size2, srf
	title = RSD-10 Pioneer / SS-20 (3x 150 kt MIRV)
	manufacturer = BDNukes
	description = The Soviet road-mobile missile that set off the Euromissile crisis. Driven around on a huge six-axle truck and hard to find, it could put three 150 kiloton warheads on separate targets anywhere in Western Europe. Give it a GPS target and launch it vertically.
	tags = ss-20 ss20 saber rsd-10 rsd10 pioneer irbm ballistic missile mirv road mobile maz-547 soviet nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1

	mass = 37
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 2000
	breakingTorque = 2000
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 16.5
		bodyColor = 0.26, 0.33, 0.22      // Soviet dark green
		shininess = 0.2
		panelLines = true
		seamSpacing = 1.6
		collider = capsule
		segments = 64
		PROFILE
		{
			point = 0.00, 0.00    // ogive payload shroud
			point = 0.05, 0.06
			point = 0.15, 0.12
			point = 0.45, 0.27
			point = 0.80, 0.40
			point = 1.30, 0.55
			point = 1.80, 0.68
			point = 2.40, 0.78
			point = 3.00, 0.85
			point = 3.30, 0.88
			point = 3.60, 0.895
			point = 16.25, 0.895
			point = 16.32, 0.87
			point = 16.32, 0.87
			point = 16.32, 0.50   // aft closure
			point = 16.32, 0.50
			point = 16.36, 0.36   // nozzle throat
			point = 16.43, 0.48
			point = 16.50, 0.62   // nozzle exit
			point = 16.50, 0.00
		}
		BAND    // shroud joint
		{
			from = 3.6
			to = 3.8
			color = 0.85, 0.85, 0.82
		}
		BAND    // stage 2 case seam
		{
			from = 6.0
			to = 6.04
			color = 0.18, 0.22, 0.15
		}
		BAND    // stage 2 / stage 1 joint
		{
			from = 8.3
			to = 8.5
			color = 0.85, 0.85, 0.82
		}
		BAND    // stage 1 case seam
		{
			from = 12.3
			to = 12.34
			color = 0.18, 0.22, 0.15
		}
		BAND    // aft skirt
		{
			from = 15.9
			to = 16.32
			color = 0.20, 0.25, 0.17
		}
		BAND    // nozzle
		{
			from = 16.32
			to = 16.5
			color = 0.09, 0.09, 0.10
		}
		FINS    // stage 2 cable raceways
		{
			count = 2
			roll = 0
			rootFront = 3.9
			rootBack = 8.25
			tipFront = 3.92
			tipBack = 8.23
			span = 0.93
			thickness = 0.08
			color = 0.22, 0.28, 0.19
		}
		FINS    // stage 1 cable raceways (dropped with the stage)
		{
			count = 2
			roll = 0
			rootFront = 8.6
			rootBack = 15.8
			tipFront = 8.62
			tipBack = 15.78
			span = 0.93
			thickness = 0.08
			color = 0.22, 0.28, 0.19
			parent = boosterStage
		}
		TRANSFORM    // stage 2 (cruise phase)
		{
			name = exhaustTransform
			position = 0, 0, -0.15
			forward = 0, 0, -1
		}
		TRANSFORM                         // stage 1 body: dropped whole at boost burnout (boostTransformName), nozzles and fins with it
		{
			name = boosterStage
			position = 0, 0, -0.15
			forward = 0, 0, -1
			detach = 8.4, 16.5
		}
		TRANSFORM    // stage 1 (boost phase; dropped at burnout)
		{
			name = boosterExhaustTransform
			parent = boosterStage
			position = 0, 0, -8.25
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = SS-20

		thrust = 935                    // kN, stage 1
		cruiseThrust = 390              // kN, stage 2
		dropTime = 0                    // <= 0.5 s: BDModuleNuke will not detonate in the Drop state
		boostTime = 60
		cruiseTime = 60
		guidanceActive = true

		useFuel = true
		boosterFuelMass = 22
		cruiseFuelMass = 9
		decoupleBoosters = true
		boosterMass = 2
		boosterDecoupleSpeed = 5

		decoupleSpeed = 3
		decoupleForward = true

		audioClipPath = BDNukes/Sounds/bdnukes_heavy_motor_loop
		boostClipPath = BDNukes/Sounds/bdnukes_heavy_motor_loop
		boostTransformName = boosterStage
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 3000

		aero = true
		liftArea = 0.05
		steerMult = 3
		maxTorque = 1500
		torqueRampUp = 2
		aeroSteerDamping = 6
		maxAoA = 15
		maxTurnRateDPS = 10
		vacuumSteerable = true

		missileType = missile
		homingType = agmballistic
		BallisticOverShootFactor = 0.7
		BallisticAngle = 45
		targetingType = gps
		maxOffBoresight = 180           // vertical launch
		lockedSensorFOV = 10

		minStaticLaunchRange = 20000
		maxStaticLaunchRange = 200000
		UseStaticMaxLaunchRange = true
		maxAltitude = 1000000           // non-zero so the ballistic climb is not flagged as a miss

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false

		DetonationDistance = 700        // airburst over the aim point; the other 2 RVs land around it
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 150
		thermalRadius = 3454     // round(650 * 150^(1/3))
		fluence = 150
		isEMP = true
		reportingName = SS-20 MIRV
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleMIRVBus
		warheads = 3
		spread = 3000
		interval = 0.8
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
