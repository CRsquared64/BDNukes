// Boeing AGM-86B ALCM: subsonic air-launched cruise missile carried by the B-52H (in service from 1982).
// W80-1 warhead, selectable 5 / 150 kt. 6.3 m long, ~0.62 m body width, 3.7 m wingspan, ~1,450 kg.
// Rounded, slightly chined body; swept wings that swing out mid-body after release; a dorsal inlet for the
// Williams F107 turbofan near the tail; three tail control surfaces (a vertical fin and two anhedral elevons).
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesAGM86B
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.31, 0.3, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 50000
	cost = 50000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = srf
	title = AGM-86B ALCM (W80, 5/150 kt)
	manufacturer = BDNukes
	description = The US Air Force's nuclear air-launched cruise missile, carried by the B-52H and flown low over the terrain by a small turbofan engine. It carries a W80-1 warhead whose yield can be set to 5 or 150 kilotons before launch. Launch it at cruising speed: it has no booster, and here it follows the terrain to a GPS target before detonating.
	tags = agm-86 agm86 agm-86b alcm air launched cruise missile w80 b-52 terrain following nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 1.45
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3000

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 6.3
		bodyColor = 0.82, 0.83, 0.84      // light grey
		shininess = 0.3
		panelLines = true
		seamSpacing = 1.0
		collider = capsule
		PROFILE
		{
			point = 0.00, 0.00    // blunt rounded nose
			point = 0.02, 0.06
			point = 0.05, 0.10
			point = 0.10, 0.145
			point = 0.15, 0.17
			point = 0.23, 0.205
			point = 0.32, 0.235
			point = 0.43, 0.26
			point = 0.55, 0.28
			point = 0.70, 0.293
			point = 0.85, 0.302
			point = 1.00, 0.307
			point = 1.15, 0.31
			point = 3.90, 0.31    // long constant section
			point = 4.05, 0.317   // slight swell where the inlet duct rises to the engine
			point = 4.20, 0.32
			point = 4.90, 0.32
			point = 5.08, 0.312
			point = 5.25, 0.30    // tapered tail cone
			point = 5.42, 0.283
			point = 5.60, 0.26
			point = 5.78, 0.232
			point = 5.95, 0.20
			point = 6.08, 0.175
			point = 6.20, 0.15
			point = 6.24, 0.14    // exhaust lip
			point = 6.24, 0.14
			point = 6.24, 0.105   // recessed turbofan exhaust
			point = 6.24, 0.105
			point = 6.30, 0.095
			point = 6.30, 0.00
		}
		BAND    // dark nose cap
		{
			from = 0.0
			to = 0.3
			color = 0.25, 0.26, 0.27
		}
		BAND    // nose / guidance section joint
		{
			from = 0.62
			to = 0.64
			color = 0.20, 0.20, 0.21
		}
		BAND    // guidance / warhead section joint
		{
			from = 1.4
			to = 1.42
			color = 0.20, 0.20, 0.21
		}
		BAND    // warhead / fuel tank joint
		{
			from = 2.43
			to = 2.45
			color = 0.20, 0.20, 0.21
		}
		BAND    // fuel tank / engine section joint
		{
			from = 3.95
			to = 3.97
			color = 0.20, 0.20, 0.21
		}
		BAND    // tail cone joint
		{
			from = 5.1
			to = 5.12
			color = 0.20, 0.20, 0.21
		}
		BAND    // exhaust surround
		{
			from = 6.15
			to = 6.24
			color = 0.18, 0.18, 0.18
		}
		BAND    // exhaust duct
		{
			from = 6.24
			to = 6.3
			color = 0.09, 0.09, 0.10
		}
		FINS    // swept wings (deployed), mid-body, 3.66 m span overall
		{
			count = 2
			roll = 0
			rootFront = 2.55
			rootBack = 3.35
			tipFront = 3.3
			tipBack = 3.7
			span = 1.83
			thickness = 0.04
			color = 0.80, 0.81, 0.82
		}
		FINS    // tail: vertical fin on top plus two elevons with 30 deg anhedral (90, 210, 330 deg)
		{
			count = 3
			roll = 90
			rootFront = 5.5
			rootBack = 6.1
			tipFront = 5.92
			tipBack = 6.22
			span = 0.75
			thickness = 0.03
			color = 0.80, 0.81, 0.82
		}
		FINS    // dorsal engine inlet hump: a single thick, short "fin" on the top of the tail cone
		{
			count = 1
			roll = 90
			rootFront = 4.05
			rootBack = 5.25
			tipFront = 4.35
			tipBack = 5.05
			span = 0.43
			thickness = 0.34
			color = 0.74, 0.75, 0.76
		}
		FINS    // wing pivot fairing on the spine
		{
			count = 1
			roll = 90
			rootFront = 2.4
			rootBack = 3.55
			tipFront = 2.62
			tipBack = 3.45
			span = 0.36
			thickness = 0.22
			color = 0.76, 0.77, 0.78
		}
		FINS    // ventral radar altimeter / datalink blade
		{
			count = 1
			roll = 270
			rootFront = 1.7
			rootBack = 1.84
			tipFront = 1.79
			tipBack = 1.86
			span = 0.42
			thickness = 0.012
			color = 0.22, 0.23, 0.24
		}
		TRANSFORM    // turbofan exhaust: BDArmory always looks up "exhaustTransform"
		{
			name = exhaustTransform
			position = 0, 0, -3.15
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = AGM-86B

		// subsonic terrain-following cruise missile, adapted from BDArmory's AGM86-17 (AGM-86C)
		thrust = 70                       // engine spool-up kick after release
		cruiseThrust = 13                 // AGM86-17 uses 11 kN for 1.15 t; scaled to 1.45 t. The real F107 gives only
		                                  // 2.7 kN, but BDArmory's liftArea-based drag needs BDArmory-scale thrust to hold Mach 0.73.
		                                  // No useFuel: 600 s of cruise burns only ~30 kg of the real ~450 kg of fuel.
		dropTime = 0.5                    // AGM86-17 uses 1 s; BDModuleNuke refuses to detonate during Drop
		boostTime = 3
		cruiseTime = 600                  // ~150 km at cruise speed (the real ALCM flies ~2,400 km)
		cruiseDelay = 0
		guidanceActive = true
		maxTurnRateDPS = 25

		CruiseSpeed = 250                 // ~Mach 0.73
		CruisePredictionTime = 15
		CruiseAltitude = 100
		DetonationDistance = 0

		decoupleSpeed = 5
		decoupleForward = false

		audioClipPath = BDArmory/Sounds/jet
		boostClipPath = BDArmory/Sounds/jet
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 250

		missileType = missile
		homingType = Cruise
		targetingType = gps
		terminalGuidanceShouldActivate = false

		maxOffBoresight = 65
		lockedSensorFOV = 6
		agmDescentRatio = 1.2

		maxAoA = 40
		aero = true
		liftArea = 0.0095
		steerMult = 8
		maxTorque = 80
		torqueRampUp = 50

		minLaunchSpeed = 125
		minStaticLaunchRange = 8000       // BDArmory blast standoff at 150 kt is ~6.1 km
		maxStaticLaunchRange = 120000

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 150              // kilotons; overwritten by ModuleNukeYieldSelector
		thermalRadius = 3454     // round(650 * 150^(1/3))
		fluence = 150
		isEMP = true
		reportingName = AGM-86B ALCM
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeYieldSelector
		yields = 5, 150
		defaultIndex = 1
		thermalRadiusAtMax = 3454
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
