// W54 SADM (Special Atomic Demolition Munition, US Army 1964-1989), the "backpack nuke": a W54 warhead in a
// cylindrical case about 0.66 m long and 0.4 m across, ~23 kg for the device (the H-912 transport pack weighed
// more), carried by one soldier and set off by a mechanical timer. Variable yield, roughly 0.01 to 1 kt.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
//
// A cargo part: put it in a crew pod or cargo container inventory in the editor, take it out on EVA and drop or
// place it on the ground (it becomes a small vessel of its own). Set the timer and yield, press Arm and leave.
// ModuleNukeDemolitionCharge runs the timer and fires the BDModuleNuke.
PART:NEEDS[BDArmory]
{
	name = bdnukesW54SADM
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// Stands upright on its flat bottom (-Y)
	node_attach = 0.0, -0.33, 0.0, 0, -1, 0, 0

	TechRequired = precisionEngineering
	entryCost = 15000
	cost = 9000
	category = none
	bdacategory = Warheads
	subcategory = 0
	bulkheadProfiles = srf
	title = W54 SADM Backpack Nuke (0.01-1 kt)
	manufacturer = BDNukes
	description = The Special Atomic Demolition Munition: a W54 warhead in a canister small enough for one soldier to carry on his back. Teams were trained to parachute or swim it in behind enemy lines and leave it at a bridge, dam or tunnel with a mechanical timer running. Carry it in an inventory, place it on EVA, set the timer and yield, arm it, and get well clear.
	tags = sadm w54 backpack suitcase demolition atomic special munition timer nuke nuclear eva cargo inventory
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 0.03
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 15
	breakingForce = 50
	breakingTorque = 50
	maxTemp = 1500

	MODULE
	{
		name = ModuleProceduralModel
		axis = Y
		length = 0.66
		bodyColor = 0.30, 0.33, 0.22      // olive drab canister
		shininess = 0.1
		panelLines = false
		seamSpacing = 0
		collider = box
		segments = 48
		PROFILE
		{
			point = 0.00, 0.00    // top lid
			point = 0.00, 0.17
			point = 0.00, 0.17
			point = 0.005, 0.185
			point = 0.02, 0.195
			point = 0.04, 0.20
			point = 0.04, 0.20
			point = 0.16, 0.20    // upper carrying strap
			point = 0.16, 0.20
			point = 0.16, 0.205
			point = 0.16, 0.205
			point = 0.19, 0.205
			point = 0.19, 0.205
			point = 0.19, 0.20
			point = 0.19, 0.20
			point = 0.48, 0.20    // lower carrying strap
			point = 0.48, 0.20
			point = 0.48, 0.205
			point = 0.48, 0.205
			point = 0.51, 0.205
			point = 0.51, 0.205
			point = 0.51, 0.20
			point = 0.51, 0.20
			point = 0.62, 0.20
			point = 0.64, 0.195
			point = 0.66, 0.17
			point = 0.66, 0.17
			point = 0.66, 0.00    // flat base
		}
		BAND    // lid and clamp ring
		{
			from = 0.0
			to = 0.05
			color = 0.22, 0.24, 0.17
		}
		BAND    // upper carrying strap
		{
			from = 0.16
			to = 0.19
			color = 0.12, 0.12, 0.10
		}
		BAND    // yellow stencilled data plate
		{
			from = 0.32
			to = 0.36
			color = 0.80, 0.70, 0.20
		}
		BAND    // lower carrying strap
		{
			from = 0.48
			to = 0.51
			color = 0.12, 0.12, 0.10
		}
		BAND    // base
		{
			from = 0.62
			to = 0.66
			color = 0.22, 0.24, 0.17
		}
		FINS    // carrying handle lugs on the lid
		{
			count = 2
			roll = 0
			rootFront = 0.06
			rootBack = 0.14
			tipFront = 0.07
			tipBack = 0.13
			span = 0.235
			thickness = 0.025
			color = 0.15, 0.15, 0.13
		}
		FINS    // lid clamp latches
		{
			count = 4
			roll = 45
			rootFront = 0.02
			rootBack = 0.08
			tipFront = 0.03
			tipBack = 0.07
			span = 0.215
			thickness = 0.03
			color = 0.15, 0.15, 0.13
		}
	}

	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 45                 // litres: fits a kerbal's EVA inventory
		stackableQuantity = 1
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 1                         // kilotons; overwritten by ModuleNukeYieldSelector
		thermalRadius = 650               // round(650 * 1^(1/3))
		fluence = 1
		isEMP = false
		reportingName = W54 SADM
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeYieldSelector
		yields = 0.01, 0.02, 0.05, 0.1, 0.25, 0.5, 1
		defaultIndex = 3
		thermalRadiusAtMax = 650
		lockAfterRelease = false          // set on the ground, not before launch
	}

	MODULE
	{
		name = ModuleNukeDemolitionCharge
		timerSetting = 60
		minTimer = 10
		maxTimer = 600
		interactionRange = 4              // m, an EVA kerbal standing next to it
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
