// Douglas AIR-2A Genie (MB-1): unguided air-to-air rocket with the W25 warhead (1.5 kt), in US service 1957-1985
// on the F-89J, F-101B and F-106A interceptors. 2.95 m long, 0.445 m diameter, 1.0 m fin span, 373 kg.
// Thiokol SR49 solid motor (~162 kN for ~2 s) gives about Mach 3.3; range ~10 km. Fired at bomber formations
// with no guidance at all: the fire-control system set a time fuze to burst it among the bombers, and the
// launching fighter pulled away to escape the burst. Only live-fired once, in Operation Plumbbob "John" (1957).
// BDArmory ships its own AIR-2 (bahaAIR-2); this one has the BDNukes cinematic profile, a time-fuze backup and a
// BDNukes name so both can be installed.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesAIR2Genie
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.2225, 0.0, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 15000
	cost = 12000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = srf
	title = AIR-2 Genie (W25, 1.5 kt)
	manufacturer = BDNukes
	description = The only nuclear weapon ever built to shoot down aircraft without any guidance at all. The Genie is a fat, fast rocket with a 1.5 kiloton warhead: point the interceptor at the bomber formation, fire, and turn away hard. It bursts when it reaches its target or when its time fuze runs out, and anything within a few hundred metres of the flash is gone.
	tags = air-2 air2 genie mb-1 w25 unguided rocket air to air interceptor f-106 f-101 nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 0.373
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 2.95
		bodyColor = 0.78, 0.80, 0.80      // bare aluminium
		shininess = 0.55
		panelLines = true
		seamSpacing = 0.7
		collider = capsule
		PROFILE
		{
			// stubby blunt ogive nose, fat cylinder, short boat-tail at the nozzle
			point = 0.00, 0.00
			point = 0.03, 0.06
			point = 0.15, 0.13
			point = 0.35, 0.18
			point = 0.60, 0.215
			point = 0.80, 0.2225
			point = 2.78, 0.2225
			point = 2.90, 0.20
			point = 2.95, 0.17
			point = 2.95, 0.00
		}
		BAND    // warhead section
		{
			from = 0.00
			to = 0.95
			color = 0.86, 0.86, 0.84
		}
		BAND    // warhead / motor joint
		{
			from = 0.95
			to = 0.98
			color = 0.12, 0.12, 0.12
		}
		BAND    // yellow high-explosive band
		{
			from = 0.60
			to = 0.66
			color = 0.90, 0.75, 0.15
		}
		BAND    // nozzle surround
		{
			from = 2.88
			to = 2.95
			color = 0.25, 0.25, 0.26
		}
		FINS    // four folding tail fins (shown deployed), 1.0 m span overall
		{
			count = 4
			roll = 45
			rootFront = 2.45
			rootBack = 2.93
			tipFront = 2.70
			tipBack = 2.95
			span = 0.28
			thickness = 0.012
			color = 0.74, 0.76, 0.76
		}
		TRANSFORM
		{
			name = exhaustTransform
			position = 0, 0, -1.475
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = AIR-2 Genie

		// after BDArmory's own AIR-2: a 2 s boost and nothing else, essentially unguided
		thrust = 162
		cruiseThrust = 0
		dropTime = 0                      // BDModuleNuke refuses to detonate during Drop
		boostTime = 2
		cruiseTime = 0
		guidanceActive = true
		maxTurnRateDPS = 1                // "guidance" only to keep it pointed; it flies straight

		audioClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
		boostTransformName = exhaustTransform
		boostExhaustTransformName = exhaustTransform

		aero = true
		liftArea = 0.004
		steerMult = 4
		maxTorque = 10
		maxAoA = 5
		torqueRampUp = 5

		decoupleSpeed = 5
		decoupleForward = true

		homingType = aam
		missileType = missile
		targetingType = none
		maxOffBoresight = 10
		allAspect = false

		// proximity burst among the bombers, and a time fuze as the real one had: it bursts at ~12 s
		// (about 10 km out) whatever happens, so a miss is still a near miss
		DetonationDistance = 300
		isTimed = true
		detonationTime = 12

		minStaticLaunchRange = 2000       // 744 m thermal radius plus the BDArmory standoff
		maxStaticLaunchRange = 10000

		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 1.5
		thermalRadius = 744      // round(650 * 1.5^(1/3))
		fluence = 1.5
		isEMP = true
		reportingName = AIR-2 Genie
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
