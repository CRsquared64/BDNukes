// AN602 "Tsar Bomba": 50 Mt three-stage thermonuclear bomb, detonated over Novaya Zemlya on 30 Oct 1961.
// 8.0 m long, 2.1 m diameter, ~27 t. Dropped from 10.5 km, slowed by a ~1600 m^2 parachute,
// barometric fuze airburst at ~4 km. The model is generated in code (ModuleTsarBombaModel);
// MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesTsarBomba
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 1.05, 0.0, 0, 1, 0, 1

	TechRequired = experimentalScience
	entryCost = 50000
	cost = 250000
	category = none
	bdacategory = Bombs
	subcategory = 0
	bulkheadProfiles = srf
	title = AN602 "Tsar Bomba" (50 Mt)
	manufacturer = BDNukes
	description = The largest nuclear device ever detonated. A three-stage thermonuclear free-fall bomb with a yield of 50 megatons. Released by staging, it deploys a 1600 m² retarding parachute so the carrier can escape, then airbursts at 4 km by barometric fuze. The fireball is roughly 10 km across, the cloud climbs to the edge of space and the shockwave flattens everything for tens of kilometres. Bring a fast plane and a long runway home.
	tags = tsar bomba an602 ivan nuke nuclear thermonuclear hydrogen bomb megaton
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1
	stagingIcon = DECOUPLER_HOR

	mass = 27
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 15
	breakingForce = 2000
	breakingTorque = 2000
	maxTemp = 2400

	MODULE
	{
		name = ModuleTsarBombaModel
	}

	MODULE
	{
		name = ModuleDecouple
		ejectionForce = 25
		explosiveNodeID = srf
		staged = true
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 50000            // kilotons
		thermalRadius = 30000    // m, BDArmory clamps blast/thermal damage to this distance
		fluence = 50000          // thermal pulse strength (BDArmory scales skin heating by this)
		isEMP = true
		reportingName = AN602 Tsar Bomba
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeFuze
		impactFuze = true
		impactFuzeSpeed = 10
		detonateOnDestroyed = true
		airburstAltitude = 4000   // the real burst height
		maxAirburstAltitude = 15000
		maxProximityRange = 10000
		armingDelay = 5
	}

	MODULE
	{
		name = ModuleNukeParachute
		canopyArea = 1600
		dragCoefficient = 0.8
		deployDelay = 2
		inflationTime = 4
		riserLength = 55
		attachPoint = 0, 0, -4
	}
}
