// Hughes AIM-47 (GAR-9) Falcon: long-range radar-guided air-to-air missile for the XF-108 Rapier and YF-12A.
// Optional W42 nuclear warhead, ~0.25 kt (the nuclear option was dropped in 1958; the test rounds flew with a
// 45 kg HE warhead). 3.82 m long, 0.343 m diameter, 0.84 m span, 371 kg, Mach 4, >160 km range. The original
// Aerojet motor was meant to reach Mach 6; the Lockheed XSR13 that flew gave Mach 4 (designation-systems.net).
// Pointed radome, long cylindrical body, four long-chord low-aspect wings and four small tail control fins.
// Flight-tested 1962-1966 but never deployed (it led to the AIM-54 Phoenix).
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesAIM47
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.1715, 0.0, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 25000
	cost = 25000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = srf
	title = AIM-47 Falcon (W42, 0.25 kt)
	manufacturer = BDNukes
	description = A long-range air-to-air missile built for the Mach 3 YF-12A interceptor, guided by the AN/ASG-18 radar and able to reach about Mach 4 and 160 km. It could carry the 0.25 kiloton W42 warhead, so a near miss would still destroy a bomber. It was test-fired from the YF-12A but never entered service; keep the target locked with your radar all the way in.
	tags = aim-47 aim47 gar-9 falcon w42 yf-12 xf-108 radar semi active long range air to air aam nuke nuclear missile
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 0.371
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 3.8
		bodyColor = 0.92, 0.92, 0.90      // white test-round finish
		shininess = 0.4
		panelLines = true
		seamSpacing = 0.8
		collider = capsule
		PROFILE
		{
			// long pointed ogive radome, cylinder, short boat-tail around the nozzle
			point = 0.00, 0.00
			point = 0.10, 0.03
			point = 0.28, 0.07
			point = 0.50, 0.107
			point = 0.75, 0.138
			point = 1.00, 0.160
			point = 1.25, 0.1715
			point = 3.62, 0.1715
			point = 3.72, 0.165
			point = 3.79, 0.150
			point = 3.80, 0.00
		}
		BAND    // fibreglass radome
		{
			from = 0.00
			to = 1.22
			color = 0.80, 0.76, 0.66
		}
		BAND    // radome / guidance section joint
		{
			from = 1.22
			to = 1.25
			color = 0.10, 0.10, 0.10
		}
		BAND    // warhead / motor section joint
		{
			from = 2.05
			to = 2.08
			color = 0.10, 0.10, 0.10
		}
		BAND    // nozzle surround
		{
			from = 3.70
			to = 3.80
			color = 0.25, 0.25, 0.26
		}
		FINS    // four long-chord, low-aspect delta wings along the rear half (0.84 m span overall)
		{
			count = 4
			roll = 45
			rootFront = 1.55
			rootBack = 3.30
			tipFront = 2.95
			tipBack = 3.30
			span = 0.42
			thickness = 0.012
			color = 0.88, 0.88, 0.86
		}
		FINS    // four small tail control fins, in line with the wings
		{
			count = 4
			roll = 45
			rootFront = 3.40
			rootBack = 3.76
			tipFront = 3.56
			tipBack = 3.76
			span = 0.32
			thickness = 0.010
			color = 0.88, 0.88, 0.86
		}
		TRANSFORM    // cruise (sustain pulse) exhaust: BDArmory always looks up "exhaustTransform"
		{
			name = exhaustTransform
			position = 0, 0, -1.9
			forward = 0, 0, -1
		}
		TRANSFORM    // boost exhaust (boostTransformName / boostExhaustTransformName)
		{
			name = boostTransform
			position = 0, 0, -1.9
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = AIM-47

		// long-range lofting radar missile, adapted from BDArmory's aim-120 and BDArmory Extended's AIM-54 Phoenix
		// Solid motor at Isp ~255 s: 140 kg boost grain + 45 kg sustain grain (50% propellant fraction).
		// Boost 16 g at launch rising to 26 g; ideal delta-v ~1.2 km/s boost + ~0.55 km/s sustain.
		thrust = 60                       // kN
		cruiseThrust = 3.8                // kN sustain
		dropTime = 0.4                    // BDModuleNuke refuses to detonate during Drop: keep short
		boostTime = 6
		cruiseTime = 30
		guidanceActive = true
		maxTurnRateDPS = 25

		useFuel = true
		boosterFuelMass = 0.14
		cruiseFuelMass = 0.045

		decoupleSpeed = 5
		decoupleForward = false

		audioClipPath = BDArmory/Sounds/rocketLoop
		boostClipPath = BDArmory/Sounds/rocketLoop
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
		boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
		boostTransformName = boostTransform
		boostExhaustTransformName = boostTransform

		optimumAirspeed = 1200            // Mach 4 at altitude

		aero = true
		liftArea = 0.004                  // AIM-120: 0.002 for 152 kg; AIM-54: 0.01 for 460 kg
		steerMult = 6
		maxTorque = 50
		maxAoA = 30
		aeroSteerDamping = 8
		torqueRampUp = 40

		missileType = missile
		homingType = aamloft
		LoftMaxAltitude = 30000           // the YF-12A launched from ~24 km; the missile climbs above that
		LoftRangeOverride = 30000
		LoftAltitudeAdvMax = 5000
		LoftMinAltitude = 0
		LoftAngle = 25
		LoftTermAngle = 30                // steeper dive suits a very fast missile
		LoftRangeFac = 0.5
		LoftVelComp = -0.25
		LoftVertVelComp = -0.25
		terminalHomingRange = 12000
		terminalHomingType = pronav
		pronavGain = 3

		// semi-active radar homing: the launching aircraft's radar must keep the target locked (like BDAe's AIM-26)
		targetingType = radar
		activeRadarRange = 0
		radarLOAL = false
		maxOffBoresight = 60
		lockedSensorFOV = 4
		uncagedLock = false
		chaffEffectivity = 1

		// Proximity burst at closest approach. Above ~14 km (air density < 0.1) BDArmory's nuclear blast does almost
		// nothing and the kill is by heating: skin +0.25*337e6*6.75/(4 pi r^2) = +1130 K at 200 m but +4500 K at 100 m,
		// so wait for the closest point instead of bursting as soon as the target is 200 m away.
		DetonationDistance = 150
		DetonateAtMinimumDistance = true

		minStaticLaunchRange = 2000       // well outside the 250 m standoff (NotSafe to 312 m) and the 409 m thermal radius
		maxStaticLaunchRange = 160000

		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 0.25             // kilotons
		thermalRadius = 409      // round(650 * 0.25^(1/3))
		fluence = 0.25
		isEMP = true
		reportingName = AIM-47 Falcon
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
