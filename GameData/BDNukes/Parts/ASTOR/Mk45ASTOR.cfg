// Mk 45 ASTOR (Anti-Submarine TORpedo): wire-guided submarine-launched torpedo with the W34 warhead (11 kt),
// in US Navy service 1960-1976. 5.77 m long, 0.483 m (19 in) diameter so it fits a 21 in tube, ~1,090 kg.
// Electric, about 40 knots (~20 m/s), range ~13 km. Steered by wire from the launching submarine and detonated
// by command; crews joked its kill probability was 2: the target and the launching boat.
// BDArmory has no wire guidance. It is semi-active here (activeRadarRange = 0, no LOAL): the launching vessel's
// sonar / radar lock steers it all the way in, which plays the same way.
// Model is generated by ModuleProceduralModel; MODEL below is only a placeholder that is stripped at load.
PART:NEEDS[BDArmory]
{
	name = bdnukesMk45ASTOR
	module = Part
	author = BDNukes

	MODEL
	{
		model = BDArmory/Parts/ArmorPlate/Panel
		scale = 0.01, 0.01, 0.01
	}
	rescaleFactor = 1

	// BDArmory convention: nose along +Z, hangs from its +Y side
	node_attach = 0.0, 0.2415, 0.0, 0, 1, 0, 1

	TechRequired = precisionEngineering
	entryCost = 30000
	cost = 30000
	category = none
	bdacategory = Missiles
	subcategory = 0
	bulkheadProfiles = srf
	title = Mk 45 ASTOR Nuclear Torpedo (W34, 11 kt)
	manufacturer = BDNukes
	description = A Cold War submarine torpedo carrying an 11 kiloton warhead, meant to kill a submarine or a whole surface group in one shot. It runs slowly and quietly to the target, steered by the launching boat's sonar, and its underwater burst throws up a column of spray and a racing base surge. Keep well clear: in the real Navy it was said to kill two boats, the target and yours.
	tags = mk45 mk-45 astor torpedo w34 submarine underwater naval ship nuke nuclear
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,1

	mass = 1.09
	buoyancy = 0.4
	dragModelType = default
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 2
	crashTolerance = 300
	maxTemp = 2000

	MODULE
	{
		name = ModuleProceduralModel
		axis = Z
		length = 5.77
		bodyColor = 0.20, 0.22, 0.24      // dark grey
		shininess = 0.35
		panelLines = true
		seamSpacing = 1.1
		collider = capsule
		PROFILE
		{
			// rounded nose, long cylinder, tapered tail cone to the propellers
			point = 0.00, 0.00
			point = 0.04, 0.10
			point = 0.14, 0.17
			point = 0.30, 0.22
			point = 0.50, 0.2415
			point = 4.95, 0.2415
			point = 5.35, 0.19
			point = 5.65, 0.11
			point = 5.77, 0.06
			point = 5.77, 0.00
		}
		BAND    // warhead section
		{
			from = 0.00
			to = 1.60
			color = 0.30, 0.32, 0.34
		}
		BAND    // section joint
		{
			from = 1.60
			to = 1.63
			color = 0.08, 0.08, 0.08
		}
		BAND    // red exercise / safety band
		{
			from = 1.65
			to = 1.75
			color = 0.65, 0.12, 0.10
		}
		BAND    // tail cone
		{
			from = 4.95
			to = 5.77
			color = 0.14, 0.15, 0.16
		}
		FINS    // cruciform tail fins round the propellers
		{
			count = 4
			roll = 0
			rootFront = 5.25
			rootBack = 5.70
			tipFront = 5.40
			tipBack = 5.70
			span = 0.12
			thickness = 0.01
			color = 0.14, 0.15, 0.16
		}
		TRANSFORM    // propeller wake
		{
			name = exhaustTransform
			position = 0, 0, -2.885
			forward = 0, 0, -1
		}
		TRANSFORM
		{
			name = boostTransform
			position = 0, 0, -2.885
			forward = 0, 0, -1
		}
	}

	MODULE
	{
		name = MissileLauncher
		shortName = Mk 45 ASTOR

		// after BDArmory Extended's Tigershark, slowed to ASTOR's 40 knots and stretched to its ~13 km range
		thrust = 150
		cruiseThrust = 45
		dropTime = 0
		boostTime = 3
		cruiseTime = 650
		guidanceActive = true
		maxTurnRateDPS = 5

		decoupleSpeed = 10
		decoupleForward = true

		missileType = torpedo
		torpedo = true
		homingType = SLW
		targetingType = radar
		activeRadarRange = 0              // wire guided in life: the launcher's lock steers it all the way
		radarLOAL = false
		seekerTimeout = 30
		chaffEffectivity = 1
		maxOffBoresight = 60
		lockedSensorFOV = 5
		DetonationDistance = 150          // command burst near the target; hitting it works too
		optimumAirspeed = 21
		waterImpactTolerance = 25

		maxAoA = 12
		aero = true
		liftArea = 0.02
		steerMult = 1
		maxTorque = 70
		aeroSteerDamping = 5

		minStaticLaunchRange = 3000       // 1.4 km thermal radius plus the standoff
		maxStaticLaunchRange = 13000

		audioClipPath = BDArmory/Sounds/TorpPropFX
		exhaustPrefabPath = BDArmory/FX/TorpWake
		boostExhaustPrefabPath = BDArmory/FX/jetdriveWake
		boostTransformName = boostTransform
		boostExhaustTransformName = boostTransform

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = true
	}

	MODULE
	{
		name = BDModuleNuke
		yield = 11
		thermalRadius = 1446     // round(650 * 11^(1/3))
		fluence = 11
		isEMP = true
		reportingName = Mk 45 ASTOR
		flashModelPath = BDArmory/Models/explosion/nuke/nukeFlash
		shockModelPath = BDArmory/Models/explosion/nuke/nukeShock
		blastModelPath = BDArmory/Models/explosion/nuke/nukeBlast
		plumeModelPath = BDArmory/Models/explosion/nuke/nukePlume
		debrisModelPath = BDArmory/Models/explosion/nuke/nukeScatter
		blastSoundPath = BDArmory/Models/explosion/nuke/nukeBoom
	}

	MODULE
	{
		name = ModuleNukeCloudProfile
		style = auto
	}
}
